<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Active Work — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      padding: 4rem 2rem 2rem;
    }
    .layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      flex: 1;
      width: 100%;
    }
    .left-pane  { flex: 1; min-width: 0; }
    .right-pane { flex: 1; min-width: 0; }
    #clear-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      font-family: monospace;
      font-size: 0.75rem;
      background: none;
      color: #333;
      border: 1px solid #222;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }
    #clear-btn:hover { color: #888; border-color: #444; }

    /* idle state */
    .idle {
      text-align: center;
      color: #2a2a2a;
      padding-top: 3rem;
    }
    .idle-icon { font-size: 3rem; margin-bottom: 1rem; }
    .idle-title { font-size: 1.1rem; color: #333; margin-bottom: 0.4rem; }
    .idle-sub { font-size: 0.8rem; color: #2a2a2a; }

    /* active state */
    .work-card {
      width: 100%;
      max-width: 620px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }

    .work-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .work-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-bottom: 0.4rem;
    }
    .work-id { color: #555; font-size: 0.85rem; margin-right: 0.5rem; }
    .work-idea { font-size: 1.1rem; color: #e0e0e0; }

    /* pipeline */
    .pipeline {
      display: flex;
      padding: 1.5rem 1.25rem 1.25rem;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .stage:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 11px;
      left: 55%;
      width: 90%;
      height: 2px;
      background: #222;
      z-index: 0;
    }
    .stage.done::after  { background: #00ff9950; }
    .stage.active::after { background: #00ff9950; }

    .stage-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #2a2a2a;
      margin-bottom: 0.5rem;
      z-index: 1;
      position: relative;
    }
    .stage.done .stage-dot {
      background: #00ff99;
      border-color: #00ff99;
    }
    .stage.active .stage-dot {
      background: #00ff99;
      border-color: #00ff99;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    .stage.failed .stage-dot {
      background: #ff4444;
      border-color: #ff4444;
    }
    .stage.failed .stage-label { color: #ff444490; }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 #00ff9960; }
      50%       { box-shadow: 0 0 0 6px #00ff9920; }
    }

    .stage-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #333;
      text-align: center;
    }
    .stage.done .stage-label   { color: #00ff9970; }
    .stage.active .stage-label { color: #00ff99; }

    .stage-time {
      font-size: 0.85rem;
      color: #555;
      text-align: center;
      min-height: 0.8em;
      margin-top: 0.15rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }
    .stage.done .stage-time   { color: #00ff9980; }
    .stage.active .stage-time { color: #00ff99; }
    .stage.failed .stage-time { color: #ff444480; }

    .timer-bar {
      padding: 0.35rem 1.5rem 0.5rem;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-top: 1px solid #1a1a1a;
    }
    .timer-icon  { color: #2a2a2a; font-size: 0.7rem; }
    .timer-total { color: #00ff9960; font-variant-numeric: tabular-nums; }
    .timer-label { color: #2a2a2a; font-size: 0.65rem; }
    .timer-sep   { color: #222; margin: 0 0.2rem; }
    .token-count { color: #4488ff55; font-size: 0.7rem; font-variant-numeric: tabular-nums; }

    .work-status {
      padding: 0.75rem 1.5rem 1.25rem;
      font-size: 0.8rem;
      color: #555;
      border-top: 1px solid #1e1e1e;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff99;
      margin-right: 0.5rem;
      animation: blink 1s step-start infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .hermes-verdict {
      margin: 0 1.5rem 1.25rem;
      padding: 0.6rem 0.9rem;
      border-radius: 5px;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .hermes-verdict .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.2rem;
    }
    .hermes-approve {
      background: #0a1f12;
      border: 1px solid #00ff9940;
      color: #00ff99;
    }
    .hermes-reject {
      background: #1a0808;
      border: 1px solid #ff444440;
      color: #ff6666;
    }

    .log-panel {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }
    .log-panel-header {
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #333;
      flex-shrink: 0;
    }
    .log-output {
      padding: 0.6rem 1.25rem;
      font-size: 0.75rem;
      line-height: 1.7;
      flex: 1;
      overflow-y: auto;
      min-height: 120px;
      max-height: 70vh;
    }
    .log-empty {
      color: #2a2a2a;
      font-size: 0.8rem;
      padding: 1rem 0;
      text-align: center;
    }
    .log-line     { color: #888; white-space: pre-wrap; }
    .log-pass     { color: #00ff9990; }
    .log-fail     { color: #ff444490; }
    .log-approve  { color: #00ff99; }
    .log-reject   { color: #ff4444; }
    .log-deploy   { color: #e0e0e0; }
    .log-section  { color: #00ff9940; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="messenger.html">Messenger</a>
    <a href="index.html">App</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="notes.html">Notes</a>
  </nav>

  <div class="layout">
    <div class="left-pane" id="root"></div>
    <div class="right-pane log-panel" id="log-panel">
      <div class="log-panel-header">Agent Activity Stream</div>
      <div class="log-output" id="log-output">
        <div class="log-empty" id="log-empty">Waiting for sprint…</div>
      </div>
    </div>
  </div>
  <button id="clear-btn" onclick="clearActive()">✕ clear stuck state</button>

  <script>
    const STAGES = ["pull", "story", "code", "test", "code_review", "ac_check", "deploy"];
    const LABELS = { pull: "Pull", story: "Story", code: "Code", test: "Test (DoD)", code_review: "Code Review", ac_check: "AC Check", deploy: "Deploy" };
    const STATUS_TEXT = {
      pull:        "Pulling item from backlog…",
      story:       "Writing user story and implementing…",
      code:        "Applying code changes…",
      test:        "Running tests (DoD)…",
      code_review: "Hermes — reviewing code quality…",
      ac_check:    "Hermes — checking acceptance criteria…",
      deploy:      "Pushing to GitHub…",
      done:        "Deployed successfully.",
      rejected:    "Hermes rejected this story.",
      failed:      "An error occurred — see activity stream for details.",
    };

    let lastStageKey = undefined;
    let lastLogCount = 0;
    let lastActiveData = null;

    function render(data) {
      const root = document.getElementById("root");

      if (!data.item_id) {
        root.innerHTML = `
          <div class="idle">
            <div class="idle-icon">○</div>
            <div class="idle-title">No active work</div>
            <div class="idle-sub">Start a sprint from the board</div>
          </div>`;
        return;
      }

      const isRejected = data.stage === "rejected";
      const isFailed   = data.stage === "failed";
      const isDone     = data.stage === "done";
      const stageIdx   = isRejected ? STAGES.indexOf(data.rejected_at || "ac_check")
                       : isFailed   ? STAGES.indexOf(data.failed_at || "code")
                       : isDone     ? STAGES.length
                       : STAGES.indexOf(data.stage);

      const dots = STAGES.map((s, i) => {
        let cls = i < stageIdx ? "done" : i === stageIdx ? "active" : "";
        if ((isRejected || isFailed) && i === stageIdx) cls = "failed";
        return `<div class="stage ${cls}">
          <div class="stage-dot"></div>
          <div class="stage-label">${LABELS[s]}</div>
          <div class="stage-time" id="stime-${s}"></div>
        </div>`;
      }).join("");

      let hermesHtml = "";
      if (isFailed && data.error) {
        hermesHtml = `
          <div class="hermes-verdict hermes-reject">
            <span class="label">✗ Failed</span>
            ${escHtml(data.error)}
          </div>`;
      } else if (data.hermes_verdict) {
        const approved = data.hermes_verdict === "approve";
        hermesHtml = `
          <div class="hermes-verdict ${approved ? "hermes-approve" : "hermes-reject"}">
            <span class="label">Hermes ${approved ? "✓ Approved" : "✗ Rejected"}</span>
            ${escHtml(data.hermes_reason || "")}
          </div>`;
      }

      const spinning = !isRejected && !isFailed && !isDone;
      const totalTok = (data.tokens_in || 0) + (data.tokens_out || 0);
      const tokenHtml = totalTok > 0
        ? `<span class="timer-sep">·</span><span class="token-count">↑${fmtTokens(data.tokens_in)} ↓${fmtTokens(data.tokens_out)} tok</span>`
        : '';
      root.innerHTML = `
        <div class="work-card">
          <div class="work-header">
            <div class="work-label">Active Work</div>
            <div>
              <span class="work-id">#${data.item_id}</span>
              <span class="work-idea">${escHtml(data.idea)}</span>
            </div>
          </div>
          <div class="pipeline">${dots}</div>
          <div class="timer-bar">
            <span class="timer-icon">⏱</span>
            <span class="timer-total" id="timer-total">—</span>
            <span class="timer-label">total</span>
            ${tokenHtml}
          </div>
          ${hermesHtml}
          <div class="work-status">
            ${spinning ? '<span class="status-dot"></span>' : ""}${STATUS_TEXT[data.stage] || data.stage}
          </div>
        </div>`;
      currentTimerData = data;
      updateTimers();
    }

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function clearActive() {
      await fetch('/active/clear', { method: 'POST' });
      lastStageKey = undefined;
      lastActiveData = null;
      render({ item_id: null });
      document.getElementById('clear-btn').style.display = 'none';
    }

    function logColorClass(line) {
      if (line.startsWith('PASS'))                             return 'log-pass';
      if (line.startsWith('FAIL') || line.includes('FAILED')) return 'log-fail';
      if (line.startsWith('Hermes: APPROVE'))                 return 'log-approve';
      if (line.startsWith('Hermes: REJECT'))                  return 'log-reject';
      if (line.startsWith('Deployed:') || line.startsWith('Live at')) return 'log-deploy';
      if (line.startsWith('==='))                             return 'log-section';
      if (line.startsWith('+') && !line.startsWith('+++'))   return 'log-pass';
      if (line.startsWith('-') && !line.startsWith('---'))   return 'log-fail';
      if (line.startsWith('@@'))                             return 'log-section';
      return '';
    }

    async function pollLog() {
      try {
        const res = await fetch('/agent-log');
        const data = await res.json();
        const lines = data.lines || [];
        const out   = document.getElementById('log-output');
        const empty = document.getElementById('log-empty');

        if (lines.length === 0) {
          out.innerHTML = '<div class="log-empty" id="log-empty">Waiting for sprint…</div>';
          lastLogCount = 0;
          return;
        }

        if (empty) empty.remove();

        if (lines.length !== lastLogCount) {
          if (lines.length < lastLogCount) out.innerHTML = '';
          const newLines = lines.slice(lastLogCount);
          newLines.forEach(line => {
            const div = document.createElement('div');
            div.className = 'log-line ' + logColorClass(line);
            div.textContent = line;
            out.appendChild(div);
          });
          out.scrollTop = out.scrollHeight;
          lastLogCount = lines.length;
        }
      } catch (e) {}
    }

    async function poll() {
      try {
        const res = await fetch("/active.json?t=" + Date.now());
        const data = await res.json();

        if (data.item_id) lastActiveData = data;

        const display  = data.item_id ? data : lastActiveData;
        const stageKey = display ? `${display.item_id}:${display.stage}` : null;

        if (stageKey !== lastStageKey) {
          lastStageKey = stageKey;
          if (display) {
            render(display);
            // only show clear button for a live (not cached) active item
            document.getElementById('clear-btn').style.display = data.item_id ? 'block' : 'none';
          } else {
            render({ item_id: null });
          }
        }
      } catch (e) {}
    }

    let currentTimerData = null;

    function fmtSecs(s) {
      s = Math.floor(s);
      if (s < 0) s = 0;
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60), r = s % 60;
      if (m < 60) return m + 'm ' + (r < 10 ? '0' : '') + r + 's';
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }

    function fmtTokens(n) {
      if (!n) return '0';
      return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
    }

    function updateTimers() {
      if (!currentTimerData || !currentTimerData.stage_times) return;
      const now = Date.now() / 1000;
      const st = currentTimerData.stage_times;
      const started = currentTimerData.started;
      const cap = st["done"] || now;
      const totalEl = document.getElementById('timer-total');
      if (totalEl && started) totalEl.textContent = fmtSecs(cap - started);
      STAGES.forEach((s, i) => {
        const el = document.getElementById('stime-' + s);
        if (!el) return;
        if (!st[s]) { el.textContent = ''; return; }
        let endTime = null;
        for (let j = i + 1; j < STAGES.length; j++) {
          if (st[STAGES[j]]) { endTime = st[STAGES[j]]; break; }
        }
        if (!endTime) endTime = st["done"] || null;
        el.textContent = fmtSecs((endTime || now) - st[s]);
      });
    }

    poll();
    pollLog();
    setInterval(poll, 1500);
    setInterval(pollLog, 1500);
    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
