<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Active Work — Hello Scrum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 5rem 2rem 2rem;
    }

    .top-nav {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    .top-nav a {
      font-family: monospace;
      font-size: 0.85rem;
      background: #1a1a1a;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      text-decoration: none;
    }
    .top-nav a:hover { background: #0d3320; border-color: #00ff99; }
    #clear-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      font-family: monospace;
      font-size: 0.75rem;
      background: none;
      color: #333;
      border: 1px solid #222;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }
    #clear-btn:hover { color: #888; border-color: #444; }

    /* idle state */
    .idle {
      text-align: center;
      color: #2a2a2a;
      margin-top: 20vh;
    }
    .idle-icon { font-size: 3rem; margin-bottom: 1rem; }
    .idle-title { font-size: 1.1rem; color: #333; margin-bottom: 0.4rem; }
    .idle-sub { font-size: 0.8rem; color: #2a2a2a; }

    /* active state */
    .work-card {
      width: 100%;
      max-width: 620px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
    }

    .work-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .work-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-bottom: 0.4rem;
    }
    .work-id { color: #555; font-size: 0.85rem; margin-right: 0.5rem; }
    .work-idea { font-size: 1.1rem; color: #e0e0e0; }

    /* pipeline */
    .pipeline {
      display: flex;
      padding: 1.5rem 1.25rem 1.25rem;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .stage:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 11px;
      left: 55%;
      width: 90%;
      height: 2px;
      background: #222;
      z-index: 0;
    }
    .stage.done::after  { background: #00ff9950; }
    .stage.active::after { background: #00ff9950; }

    .stage-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #2a2a2a;
      margin-bottom: 0.5rem;
      z-index: 1;
      position: relative;
    }
    .stage.done .stage-dot {
      background: #00ff99;
      border-color: #00ff99;
    }
    .stage.active .stage-dot {
      background: #00ff99;
      border-color: #00ff99;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    .stage.failed .stage-dot {
      background: #ff4444;
      border-color: #ff4444;
    }
    .stage.failed .stage-label { color: #ff444490; }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 #00ff9960; }
      50%       { box-shadow: 0 0 0 6px #00ff9920; }
    }

    .stage-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #333;
      text-align: center;
    }
    .stage.done .stage-label   { color: #00ff9970; }
    .stage.active .stage-label { color: #00ff99; }

    .work-status {
      padding: 0.75rem 1.5rem 1.25rem;
      font-size: 0.8rem;
      color: #555;
      border-top: 1px solid #1e1e1e;
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff99;
      margin-right: 0.5rem;
      animation: blink 1s step-start infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .hermes-verdict {
      margin: 0 1.5rem 1.25rem;
      padding: 0.6rem 0.9rem;
      border-radius: 5px;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .hermes-verdict .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.2rem;
    }
    .hermes-approve {
      background: #0a1f12;
      border: 1px solid #00ff9940;
      color: #00ff99;
    }
    .hermes-reject {
      background: #1a0808;
      border: 1px solid #ff444440;
      color: #ff6666;
    }

    .log-panel {
      width: 100%;
      max-width: 620px;
      margin-top: 1rem;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }
    .log-panel-header {
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #333;
    }
    .log-output {
      padding: 0.6rem 1.25rem;
      font-size: 0.75rem;
      line-height: 1.7;
      height: calc(5 * 0.75rem * 1.7 + 1.2rem);
      overflow-y: auto;
    }
    .log-line     { color: #888; white-space: pre-wrap; }
    .log-pass     { color: #00ff9990; }
    .log-fail     { color: #ff444490; }
    .log-approve  { color: #00ff99; }
    .log-reject   { color: #ff4444; }
    .log-deploy   { color: #e0e0e0; }
    .log-section  { color: #00ff9940; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="/">Board</a>
    <a href="audit.html">Audit</a>
    <a href="workflow.html">Workflow</a>
  </nav>

  <div id="root"></div>
  <div class="log-panel" id="log-panel">
    <div class="log-panel-header">Agent Output</div>
    <div class="log-output" id="log-output"></div>
  </div>
  <button id="clear-btn" onclick="clearActive()">✕ clear stuck state</button>

  <script>
    const STAGES = ["pull", "story", "code", "test", "review", "deploy"];
    const LABELS = { pull: "Pull", story: "Story", code: "Code", test: "Test", review: "Review", deploy: "Deploy" };
    const STATUS_TEXT = {
      pull:     "Pulling item from backlog…",
      story:    "Writing user story and implementing…",
      code:     "Applying code changes…",
      test:     "Running tests…",
      review:   "Hermes reviewing…",
      deploy:   "Pushing to GitHub…",
      rejected: "Hermes rejected this story.",
    };

    let lastStage = undefined;
    let lastLogCount = 0;

    function render(data) {
      const root = document.getElementById("root");

      if (!data.item_id) {
        root.innerHTML = `
          <div class="idle">
            <div class="idle-icon">○</div>
            <div class="idle-title">No active work</div>
            <div class="idle-sub">Start a sprint from the board</div>
          </div>`;
        document.getElementById('clear-btn').style.display = 'none';
        return;
      }
      document.getElementById('clear-btn').style.display = 'block';

      const isRejected = data.stage === "rejected";
      const stageIdx = isRejected ? STAGES.indexOf("review") : STAGES.indexOf(data.stage);

      const dots = STAGES.map((s, i) => {
        let cls = i < stageIdx ? "done" : i === stageIdx ? "active" : "";
        if (isRejected && i === stageIdx) cls = "failed";
        return `<div class="stage ${cls}">
          <div class="stage-dot"></div>
          <div class="stage-label">${LABELS[s]}</div>
        </div>`;
      }).join("");

      let hermesHtml = "";
      if (data.hermes_verdict) {
        const approved = data.hermes_verdict === "approve";
        hermesHtml = `
          <div class="hermes-verdict ${approved ? "hermes-approve" : "hermes-reject"}">
            <span class="label">Hermes ${approved ? "✓ Approved" : "✗ Rejected"}</span>
            ${escHtml(data.hermes_reason || "")}
          </div>`;
      }

      const spinning = !isRejected;
      root.innerHTML = `
        <div class="work-card">
          <div class="work-header">
            <div class="work-label">Active Work</div>
            <div>
              <span class="work-id">#${data.item_id}</span>
              <span class="work-idea">${escHtml(data.idea)}</span>
            </div>
          </div>
          <div class="pipeline">${dots}</div>
          ${hermesHtml}
          <div class="work-status">
            ${spinning ? '<span class="status-dot"></span>' : ""}${STATUS_TEXT[data.stage] || data.stage}
          </div>
        </div>`;
    }

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function clearActive() {
      await fetch('/active/clear', { method: 'POST' });
      lastStage = undefined;
    }

    function logColorClass(line) {
      if (line.startsWith('PASS'))                             return 'log-pass';
      if (line.startsWith('FAIL') || line.includes('FAILED')) return 'log-fail';
      if (line.startsWith('Hermes: APPROVE'))                 return 'log-approve';
      if (line.startsWith('Hermes: REJECT'))                  return 'log-reject';
      if (line.startsWith('Deployed:') || line.startsWith('Live at')) return 'log-deploy';
      if (line.startsWith('==='))                             return 'log-section';
      if (line.startsWith('+') && !line.startsWith('+++'))   return 'log-pass';
      if (line.startsWith('-') && !line.startsWith('---'))   return 'log-fail';
      if (line.startsWith('@@'))                             return 'log-section';
      return '';
    }

    async function pollLog() {
      try {
        const res = await fetch('/agent-log');
        const data = await res.json();
        const lines = data.lines || [];
        const panel = document.getElementById('log-panel');
        const out   = document.getElementById('log-output');

        if (lines.length === 0) {
          panel.style.display = 'none';
          lastLogCount = 0;
          return;
        }

        const wasHidden = panel.style.display === 'none' || panel.style.display === '';
        panel.style.display = 'block';
        if (wasHidden) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        if (lines.length !== lastLogCount) {
          const newLines = lines.slice(lastLogCount);
          newLines.forEach(line => {
            const div = document.createElement('div');
            div.className = 'log-line ' + logColorClass(line);
            div.textContent = line;
            out.appendChild(div);
          });
          out.scrollTop = out.scrollHeight;
          lastLogCount = lines.length;
        }
      } catch (e) {}
    }

    async function poll() {
      try {
        const res = await fetch("/active.json?t=" + Date.now());
        const data = await res.json();
        if (data.stage !== lastStage) {
          lastStage = data.stage;
          render(data);
        }
      } catch (e) {}
    }

    poll();
    pollLog();
    setInterval(poll, 1500);
    setInterval(pollLog, 1500);
  </script>
</body>
</html>
