<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log — Hello Scrum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 2rem;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid #222;
      padding-bottom: 1rem;
    }
    header a {
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
    }
    header a:hover { color: #00ff99; }
    h1 { color: #00ff99; font-size: 1.8rem; }
    .subtitle { color: #555; font-size: 0.85rem; margin-top: 0.25rem; }

    .item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .item-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .item-id {
      color: #444;
      font-size: 0.8rem;
      min-width: 2rem;
    }
    .item-idea {
      flex: 1;
      font-size: 1rem;
      color: #ccc;
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-done     { background: #0d3320; color: #00ff99; border: 1px solid #00ff9940; }
    .badge-pending  { background: #1a1a00; color: #ffcc00; border: 1px solid #ffcc0040; }
    .badge-failed   { background: #2a0a0a; color: #ff4444; border: 1px solid #ff444440; }

    .steps {
      display: flex;
      gap: 0;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 60%;
      width: 80%;
      height: 1px;
      background: #2a2a2a;
    }
    .step.done::after  { background: #00ff9960; }
    .step-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 2px solid #333;
      margin-bottom: 0.4rem;
      z-index: 1;
    }
    .step.done  .step-dot { background: #00ff99; border-color: #00ff99; }
    .step.failed .step-dot { background: #ff4444; border-color: #ff4444; }
    .step-label {
      font-size: 0.65rem;
      color: #444;
      text-align: center;
    }
    .step.done  .step-label { color: #00ff9990; }
    .step.failed .step-label { color: #ff444490; }

    .item-detail {
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .detail-row {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .detail-row.full { grid-column: 1 / -1; }
    .detail-label { font-size: 0.7rem; color: #444; text-transform: uppercase; }
    .detail-value { font-size: 0.85rem; color: #aaa; }

    .empty { color: #333; text-align: center; padding: 3rem; }
    .loading { color: #444; text-align: center; padding: 3rem; }
    .error { color: #ff4444; text-align: center; padding: 3rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Back</a>
    <div>
      <h1>Audit Log</h1>
      <div class="subtitle">AI Scrum Agent — workflow history</div>
    </div>
  </header>

  <div id="log"><div class="loading">Loading...</div></div>

  <script>
    const STEPS = ["Pull", "Story", "Code", "Test", "Deploy"];

    function stepStatus(item, index) {
      if (item.status === "pending") return index === 0 ? "pending" : "";
      if (item.status === "failed") {
        if (index <= 2) return "done";
        return "failed";
      }
      // done
      return "done";
    }

    function badge(status) {
      return `<span class="badge badge-${status}">${status}</span>`;
    }

    function renderItem(item) {
      const steps = STEPS.map((label, i) => {
        const s = stepStatus(item, i);
        return `<div class="step ${s}">
          <div class="step-dot"></div>
          <div class="step-label">${label}</div>
        </div>`;
      }).join("");

      const detail = item.status === "done" ? `
        <div class="item-detail">
          <div class="detail-row full">
            <div class="detail-label">User Story</div>
            <div class="detail-value">${item.story || "—"}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Summary</div>
            <div class="detail-value">${item.summary || "—"}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Deployed</div>
            <div class="detail-value">${item.deployed || "—"}</div>
          </div>
        </div>` : "";

      return `
        <div class="item">
          <div class="item-header">
            <div class="item-id">#${item.id}</div>
            <div class="item-idea">${item.idea}</div>
            ${badge(item.status)}
          </div>
          <div class="steps">${steps}</div>
          ${detail}
        </div>`;
    }

    fetch("backlog.json?t=" + Date.now())
      .then(r => r.json())
      .then(data => {
        const items = data.items;
        if (!items || items.length === 0) {
          document.getElementById("log").innerHTML = '<div class="empty">No items in backlog.</div>';
          return;
        }
        document.getElementById("log").innerHTML = items.map(renderItem).join("");
      })
      .catch(err => {
        document.getElementById("log").innerHTML = `<div class="error">Failed to load backlog.json<br>${err}</div>`;
      });
  </script>
</body>
</html>
