<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log — Hello Scrum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 2rem;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid #222;
      padding-bottom: 1rem;
    }
    h1 { color: #00ff99; font-size: 1.8rem; }
    .subtitle { color: #555; font-size: 0.85rem; margin-top: 0.25rem; }

    .top-nav {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    .top-nav a {
      font-family: monospace;
      font-size: 0.85rem;
      background: #1a1a1a;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      text-decoration: none;
    }
    .top-nav a:hover {
      background: #0d3320;
      border-color: #00ff99;
    }

    .item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .item-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
      user-select: none;
    }
    .item-header:hover { background: #1f1f1f; }
    .item-id {
      color: #444;
      font-size: 0.8rem;
      min-width: 2rem;
    }
    .item-idea {
      flex: 1;
      font-size: 1rem;
      color: #ccc;
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-done     { background: #0d3320; color: #00ff99; border: 1px solid #00ff9940; }
    .badge-pending  { background: #1a1a00; color: #ffcc00; border: 1px solid #ffcc0040; }
    .badge-failed   { background: #2a0a0a; color: #ff4444; border: 1px solid #ff444440; }

    .chevron {
      font-size: 0.7rem;
      color: #444;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .item-body { display: none; }
    .item.expanded .item-body { display: block; }
    .item.expanded .chevron { transform: rotate(90deg); }

    .steps {
      display: flex;
      gap: 0;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }
    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 60%;
      width: 80%;
      height: 1px;
      background: #2a2a2a;
    }
    .step.done::after  { background: #00ff9960; }
    .step-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 2px solid #333;
      margin-bottom: 0.4rem;
      z-index: 1;
    }
    .step.done  .step-dot { background: #00ff99; border-color: #00ff99; }
    .step.failed .step-dot { background: #ff4444; border-color: #ff4444; }
    .step-label {
      font-size: 0.65rem;
      color: #444;
      text-align: center;
    }
    .step.done  .step-label { color: #00ff9990; }
    .step.failed .step-label { color: #ff444490; }
    .step-time {
      font-size: 0.85rem;
      color: #555;
      text-align: center;
      min-height: 0.7em;
      margin-top: 0.1rem;
      font-variant-numeric: tabular-nums;
    }
    .step.done .step-time   { color: #00ff9980; }
    .step.failed .step-time { color: #ff444480; }
    .steps-total {
      padding: 0 1.25rem 0.6rem;
      font-size: 0.7rem;
      color: #2a2a2a;
      font-variant-numeric: tabular-nums;
    }

    .section {
      padding: 1rem 1.25rem;
      border-top: 1px solid #2a2a2a;
    }
    .section-title {
      font-size: 0.7rem;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
    }
    .story-text { font-size: 0.9rem; color: #ccc; line-height: 1.5; }
    .ac-list { list-style: none; padding: 0; }
    .ac-list li {
      font-size: 0.85rem;
      color: #aaa;
      padding: 0.2rem 0;
    }
    .ac-list li::before { content: "✓ "; color: #00ff9960; }
    .diff-block {
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 0.75rem;
      font-size: 0.75rem;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.5;
      max-height: 300px;
      overflow-y: auto;
    }
    .diff-add { color: #00ff99; }
    .diff-remove { color: #ff4444; }
    .diff-meta { color: #555; }
    .test-list { list-style: none; padding: 0; }
    .test-list li {
      font-size: 0.82rem;
      padding: 0.25rem 0;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }
    .test-pass { color: #00ff99; }
    .test-fail { color: #ff4444; }
    .test-msg { color: #888; }
    .hermes-box {
      font-size: 0.85rem;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      line-height: 1.5;
    }
    .hermes-box-approve { background: #0a1f12; border: 1px solid #00ff9940; color: #00ff99; }
    .hermes-box-reject  { background: #1a0808; border: 1px solid #ff444440; color: #ff6666; }
    .hermes-verdict-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.2rem;
      font-weight: bold;
    }
    .failure-reason {
      font-size: 0.85rem;
      color: #ff6666;
      background: #1a0808;
      border: 1px solid #ff444430;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
    }
    .hermes-label { color: #ff4444; font-weight: bold; }
    .empty { color: #333; text-align: center; padding: 3rem; }
    .loading { color: #444; text-align: center; padding: 3rem; }
    .error { color: #ff4444; text-align: center; padding: 3rem; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="/">Board</a>
    <a href="active.html">Active</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
  </nav>
  <header>
    <div>
      <h1>Audit Log</h1>
      <div class="subtitle">AI Scrum Agent — workflow history</div>
    </div>
  </header>

  <div id="log"><div class="loading">Loading...</div></div>

  <script>
    const STEPS     = ["Pull", "Story", "Code", "Test", "Review", "Deploy"];
    const STEP_KEYS = ["pull", "story", "code", "test", "review", "deploy"];

    function fmtSecs(s) {
      s = Math.floor(s);
      if (s < 0) s = 0;
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60), r = s % 60;
      if (m < 60) return m + 'm ' + (r < 10 ? '0' : '') + r + 's';
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }

    function stepTime(item, i) {
      if (!item.stage_times) return '';
      const st = item.stage_times;
      const key = STEP_KEYS[i];
      if (!st[key]) return '';
      const nextKey = STEP_KEYS[i + 1];
      const end = (nextKey && st[nextKey]) || st['done'] || st['failed'] || null;
      return end ? fmtSecs(end - st[key]) : '';
    }

    function stepStatus(item, index) {
      if (item.status === "pending") return index === 0 ? "pending" : "";
      if (item.status === "failed") {
        const failedAtHermes = item.hermes_verdict === "reject";
        const failedAtTest   = !failedAtHermes && item.test_results && item.test_results.some(t => t.status === "fail");
        const failStep = failedAtHermes ? 4
                       : failedAtTest   ? 3
                       : item.diff      ? 3
                       : item.story     ? 2
                       : 1;
        if (index < failStep)  return "done";
        if (index === failStep) return "failed";
        return "";
      }
      return "done";
    }

    function badge(status) {
      return `<span class="badge badge-${status}">${status}</span>`;
    }

    function renderDiff(diff) {
      if (!diff) return "";
      const lines = diff.split("\n").map(line => {
        if (line.startsWith("+") && !line.startsWith("+++"))
          return `<span class="diff-add">${escHtml(line)}</span>`;
        if (line.startsWith("-") && !line.startsWith("---"))
          return `<span class="diff-remove">${escHtml(line)}</span>`;
        if (line.startsWith("@@") || line.startsWith("diff") || line.startsWith("index"))
          return `<span class="diff-meta">${escHtml(line)}</span>`;
        return escHtml(line);
      });
      return `<div class="section">
        <div class="section-title">Code Changes</div>
        <div class="diff-block">${lines.join("\n")}</div>
      </div>`;
    }

    function escHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function renderItem(item) {
      const steps = STEPS.map((label, i) => {
        const s = stepStatus(item, i);
        const t = stepTime(item, i);
        return `<div class="step ${s}">
          <div class="step-dot"></div>
          <div class="step-label">${label}</div>
          <div class="step-time">${t}</div>
        </div>`;
      }).join("");
      const totalTime = (() => {
        if (!item.started || !item.stage_times) return '';
        const end = item.stage_times['done'] || item.stage_times['failed'];
        return end ? '⏱ ' + fmtSecs(end - item.started) + ' total' : '';
      })();
      const tokenLine = (() => {
        if (!item.tokens_in && !item.tokens_out) return '';
        function ft(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n||0); }
        return `↑${ft(item.tokens_in)} ↓${ft(item.tokens_out)} tok`;
      })();

      const retroSection = item.retro_context ? `
        <div class="section">
          <div class="section-title">Sprint Context Fed In</div>
          <div style="font-size:0.8rem;line-height:1.6">
            ${item.retro_context.split("\n").map(l => {
              const m = l.match(/^\[(\w+)\] (.+)$/);
              if (!m) return '';
              const typeMap = {failure_pattern:'#ff666690',success_pattern:'#00ff9980',improvement:'#4488ff80',observation:'#ffcc0080'};
              const col = typeMap[m[1]] || '#88888880';
              return `<div style="color:${col};padding:0.15rem 0">${escHtml(l)}</div>`;
            }).join("")}
          </div>
        </div>` : "";

      const storySection = item.story ? `
        <div class="section">
          <div class="section-title">User Story</div>
          <div class="story-text">${escHtml(item.story)}</div>
          ${item.acceptance_criteria && item.acceptance_criteria.length ? `
            <ul class="ac-list" style="margin-top:0.5rem">
              ${item.acceptance_criteria.map(c => `<li>${escHtml(c)}</li>`).join("")}
            </ul>` : ""}
        </div>` : "";

      const diffSection = renderDiff(item.diff);

      const testSection = item.test_results && item.test_results.length ? `
        <div class="section">
          <div class="section-title">Test Results</div>
          <ul class="test-list">
            ${item.test_results.map(t => `
              <li>
                <span class="${t.status === 'pass' ? 'test-pass' : 'test-fail'}">${t.status === 'pass' ? 'PASS' : 'FAIL'}</span>
                <span class="test-msg">${escHtml(t.message)}</span>
              </li>`).join("")}
          </ul>
        </div>` : "";

      const hermesSection = item.hermes_verdict ? (() => {
        const approved = item.hermes_verdict === "approve";
        return `<div class="section">
          <div class="section-title">Hermes Review</div>
          <div class="hermes-box ${approved ? "hermes-box-approve" : "hermes-box-reject"}">
            <span class="hermes-verdict-label">${approved ? "✓ Approved" : "✗ Rejected"}</span>
            ${escHtml(item.hermes_reason || "")}
          </div>
        </div>`;
      })() : "";

      const deploySection = item.deployed ? `
        <div class="section">
          <div class="section-title">Deploy Info</div>
          <div class="detail-value" style="font-size:0.85rem;color:#aaa">${escHtml(item.summary || "")} — ${escHtml(item.deployed)}</div>
        </div>` : "";

      const failureSection = item.status === "failed" ? (() => {
        let reason = "Agent or deploy error — check server logs.";
        if (item.hermes_verdict === "reject")
          reason = `<span class="hermes-label">Hermes rejected:</span> ${escHtml(item.hermes_reason || "")}`;
        else if (item.test_results && item.test_results.some(t => t.status === "fail"))
          reason = "One or more tests failed — see test results below.";
        else if (item.error)
          reason = escHtml(item.error);
        return `<div class="section">
          <div class="section-title">Failure Reason</div>
          <div class="failure-reason">${reason}</div>
        </div>`;
      })() : "";

      return `
        <div class="item">
          <div class="item-header" onclick="this.closest('.item').classList.toggle('expanded')">
            <div class="item-id">#${item.id}</div>
            <div class="item-idea">${escHtml(item.idea)}</div>
            ${badge(item.status)}
            <span class="chevron">&#9658;</span>
          </div>
          <div class="item-body">
            <div class="steps">${steps}</div>
            ${(totalTime || tokenLine) ? `<div class="steps-total">${totalTime}${totalTime && tokenLine ? '  ·  ' : ''}${tokenLine}</div>` : ''}
            ${failureSection}
            ${retroSection}
            ${storySection}
            ${diffSection}
            ${testSection}
            ${hermesSection}
            ${deploySection}
          </div>
        </div>`;
    }

    fetch("backlog.json?t=" + Date.now())
      .then(r => r.json())
      .then(data => {
        const items = data.items
          .filter(i => i.status !== "pending")
          .sort((a, b) => {
            if (a.deployed && b.deployed) return b.deployed.localeCompare(a.deployed);
            if (a.deployed) return 1;
            if (b.deployed) return -1;
            return b.id - a.id;
          });
        if (!items.length) {
          document.getElementById("log").innerHTML = '<div class="empty">No completed items yet.</div>';
          return;
        }
        document.getElementById("log").innerHTML = items.map(renderItem).join("");
      })
      .catch(err => {
        document.getElementById("log").innerHTML = `<div class="error">Failed to load backlog.json<br>${err}</div>`;
      });
  </script>
</body>
</html>
