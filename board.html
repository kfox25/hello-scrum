<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprint Board — Hello Scrum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #222;
    }
    header h1 { color: #00ff99; font-size: 1.4rem; }
    .top-nav {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    .top-nav a {
      font-family: monospace;
      font-size: 0.85rem;
      background: #1a1a1a;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      text-decoration: none;
    }
    .top-nav a:hover {
      background: #0d3320;
      border-color: #00ff99;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      border-bottom: 1px solid #222;
    }

    .column {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
    }
    .column:last-child { border-right: none; }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #222;
      background: #141414;
    }
    .col-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
    }
    .col-count {
      font-size: 0.7rem;
      color: #333;
      margin-left: 0.5rem;
    }

    .sprint-btn {
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.3rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }
    #start-btn {
      background: #0d3320;
      color: #00ff99;
      border: 1px solid #00ff9960;
    }
    #start-btn:hover:not(:disabled) { background: #114428; border-color: #00ff99; }
    #complete-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #33333360;
    }
    #complete-btn:hover:not(:disabled) { background: #222; color: #aaa; border-color: #555; }
    .sprint-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .drop-zone {
      flex: 1;
      padding: 1rem;
      min-height: 200px;
      transition: background 0.15s;
    }
    .drop-zone.drag-over { background: #161f18; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      cursor: default;
    }
    .card.pending { cursor: grab; }
    .card.pending:active { cursor: grabbing; }
    .card.pending:hover { border-color: #3a3a3a; }
    .card.dragging { opacity: 0.4; }
    .card.insert-above { border-top: 2px solid #00ff99; }
    .card.insert-below { border-bottom: 2px solid #00ff99; }

    .drag-handle {
      color: #333;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .card.pending .drag-handle { color: #444; }
    .card.pending:hover .drag-handle { color: #00ff9980; }

    .card-id { color: #444; font-size: 0.75rem; flex-shrink: 0; }
    .card-idea { flex: 1; font-size: 0.9rem; color: #ccc; }

    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-done    { background: #0d3320; color: #00ff99; border: 1px solid #00ff9940; }
    .badge-pending { background: #1a1a00; color: #ffcc00; border: 1px solid #ffcc0040; }
    .badge-failed  { background: #2a0a0a; color: #ff4444; border: 1px solid #ff444440; }

    .hermes-tag {
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .hermes-approve { background: #0a1f12; color: #00ff9980; border: 1px solid #00ff9920; }
    .hermes-reject  { background: #1a0808; color: #ff444480; border: 1px solid #ff444420; }
    .retry-btn {
      font-family: monospace;
      font-size: 0.85rem;
      background: none;
      border: 1px solid #333;
      color: #555;
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .retry-btn:hover { color: #ffcc00; border-color: #ffcc0060; }
    .delete-btn {
      font-family: monospace;
      font-size: 0.8rem;
      background: none;
      border: 1px solid #33222240;
      color: #442222;
      border-radius: 3px;
      padding: 0.1rem 0.35rem;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }
    .delete-btn:hover { color: #ff4444; border-color: #ff444460; }

    .empty-hint {
      color: #2a2a2a;
      font-size: 0.8rem;
      text-align: center;
      padding: 2rem 1rem;
    }
    .add-item {
      display: flex;
      gap: 0.4rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a1a1a;
    }
    .add-item input {
      flex: 1;
      font-family: monospace;
      font-size: 0.85rem;
      background: #111;
      color: #ccc;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 0.4rem 0.75rem;
      outline: none;
    }
    .add-item input::placeholder { color: #333; }
    .add-item input:focus { border-color: #00ff9940; }
    .add-item button {
      font-family: monospace;
      font-size: 0.8rem;
      background: #1a1a1a;
      color: #00ff99;
      border: 1px solid #00ff9930;
      border-radius: 4px;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-item button:hover { background: #0d3320; border-color: #00ff9960; }

    /* log panel */
    #log-panel {
      display: none;
      flex-direction: column;
      height: 220px;
      border-top: 1px solid #222;
    }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1.25rem;
      background: #141414;
      border-bottom: 1px solid #222;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
    }
    #clear-log {
      background: none;
      border: none;
      color: #333;
      font-family: monospace;
      font-size: 0.75rem;
      cursor: pointer;
    }
    #clear-log:hover { color: #555; }
    #log-output {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem 1.25rem;
      font-size: 0.78rem;
      line-height: 1.6;
    }
    .log-line { white-space: pre-wrap; color: #555; }
    .log-pass  { color: #00ff9990; }
    .log-fail  { color: #ff444490; }
    .log-hermes-approve { color: #00ff99; }
    .log-hermes-reject  { color: #ff4444; }
    .log-deploy { color: #fff; }
    .log-section { color: #00ff9960; }
    .log-done { color: #00ff99; font-weight: bold; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="active.html">Active</a>
    <a href="audit.html">Audit</a>
    <a href="workflow.html">Workflow</a>
  </nav>
  <header>
    <h1>Sprint Board</h1>
  </header>

  <div class="board">
    <div class="column">
      <div class="col-header">
        <div>
          <span class="col-title">Backlog</span>
          <span class="col-count" id="backlog-count"></span>
        </div>
      </div>
      <div class="add-item">
        <input id="new-idea" placeholder="Add an idea..." onkeydown="if(event.key==='Enter')addItem('end')" />
        <button onclick="addItem('top')">↑</button>
        <button onclick="addItem('end')">↓</button>
      </div>
      <div class="drop-zone" id="backlog-zone"
           ondragover="onDragOver(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event, false)">
        <div class="empty-hint">Backlog items appear here</div>
      </div>
    </div>

    <div class="column">
      <div class="col-header">
        <div>
          <span class="col-title">Sprint</span>
          <span class="col-count" id="sprint-count"></span>
        </div>
        <div style="display:flex;gap:0.4rem">
          <button id="start-btn"    class="sprint-btn" onclick="startSprint()">▶ Start Sprint</button>
          <button id="complete-btn" class="sprint-btn" onclick="completeSprint()">✓ Complete Sprint</button>
        </div>
      </div>
      <div class="drop-zone" id="sprint-zone"
           ondragover="onDragOver(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event, true)">
        <div class="empty-hint">Drag items here to add to sprint</div>
      </div>
    </div>
  </div>

  <div id="log-panel">
    <div class="log-header">
      <span>Agent Output</span>
      <button id="clear-log" onclick="clearLog()">clear</button>
    </div>
    <div id="log-output"></div>
  </div>

  <script>
    let backlogData = null;
    let dragId = null;

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function loadBacklog() {
      const res = await fetch('/backlog?t=' + Date.now());
      backlogData = await res.json();
      renderBoard();
    }

    async function persistBacklog() {
      await fetch('/backlog', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(backlogData),
      });
    }

    function renderBoard() {
      const items = backlogData.items;
      const backlogItems = items.filter(i => i.status === 'pending' && !i.in_sprint);
      const sprintItems  = items.filter(i => i.in_sprint);

      document.getElementById('backlog-count').textContent = `(${backlogItems.length})`;
      document.getElementById('sprint-count').textContent  = `(${sprintItems.length})`;

      const backlogZone = document.getElementById('backlog-zone');
      const sprintZone  = document.getElementById('sprint-zone');

      backlogZone.innerHTML = backlogItems.length
        ? backlogItems.map(renderCard).join('')
        : '<div class="empty-hint">No pending items</div>';

      sprintZone.innerHTML = sprintItems.length
        ? sprintItems.map(renderCard).join('')
        : '<div class="empty-hint">Drag items here to add to sprint</div>';

      const hasPending    = sprintItems.some(i => i.status === 'pending');
      const hasFinished   = sprintItems.some(i => i.status === 'done' || i.status === 'failed');
      document.getElementById('start-btn').disabled    = !hasPending;
      document.getElementById('complete-btn').disabled = !hasFinished;
    }

    function renderCard(item) {
      const isPending = item.status === 'pending';
      const draggable = isPending ? 'draggable="true"' : '';
      const handle    = isPending ? '<span class="drag-handle">&#8942;&#8942;</span>' : '<span class="drag-handle"></span>';

      let hermesTag = '';
      if (item.hermes_verdict) {
        const cls = item.hermes_verdict === 'approve' ? 'hermes-approve' : 'hermes-reject';
        hermesTag = `<span class="hermes-tag ${cls}">H:${item.hermes_verdict === 'approve' ? '✓' : '✗'}</span>`;
      }

      const retryBtn = item.status === 'failed'
        ? `<button class="retry-btn" onclick="retryItem(${item.id}, event)" title="Reset to pending">↺</button>`
        : '';

      const deleteBtn = isPending && !item.in_sprint
        ? `<button class="delete-btn" onclick="deleteItem(${item.id}, event)" title="Delete">✕</button>`
        : '';

      return `<div class="card ${item.status}" data-id="${item.id}" ${draggable}
                   ondragstart="onDragStart(event)"
                   ondragend="onDragEnd(event)"
                   ondragover="onCardDragOver(event)"
                   ondragleave="onCardDragLeave(event)"
                   ondrop="onCardDrop(event)">
        ${handle}
        <span class="card-id">#${item.id}</span>
        <span class="card-idea">${escHtml(item.idea)}</span>
        ${hermesTag}
        <span class="badge badge-${item.status}">${item.status}</span>
        ${retryBtn}
        ${deleteBtn}
      </div>`;
    }

    // ── Drag and drop ─────────────────────────────────────────────────────────

    function onDragStart(e) {
      dragId = parseInt(e.currentTarget.dataset.id);
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-over');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onDrop(e, toSprint) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (dragId === null) return;

      const item = backlogData.items.find(i => i.id === dragId);
      if (!item || item.status !== 'pending') return;

      item.in_sprint = toSprint;
      dragId = null;

      renderBoard();
      persistBacklog();
    }

    function onCardDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      const card = e.currentTarget;
      const mid = card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2;
      card.classList.toggle('insert-above', e.clientY < mid);
      card.classList.toggle('insert-below', e.clientY >= mid);
    }

    function onCardDragLeave(e) {
      e.currentTarget.classList.remove('insert-above', 'insert-below');
    }

    function onCardDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      const card = e.currentTarget;
      const insertBefore = card.classList.contains('insert-above');
      card.classList.remove('insert-above', 'insert-below');

      if (dragId === null) return;
      const targetId = parseInt(card.dataset.id);
      if (dragId === targetId) return;

      const items = backlogData.items;
      const dragItem  = items.find(i => i.id === dragId);
      const targetItem = items.find(i => i.id === targetId);
      if (!dragItem || dragItem.status !== 'pending') return;

      // move to same column as target
      dragItem.in_sprint = targetItem.in_sprint || false;

      // reorder in array
      const srcIdx = items.indexOf(dragItem);
      items.splice(srcIdx, 1);
      const tgtIdx = items.indexOf(targetItem);
      items.splice(insertBefore ? tgtIdx : tgtIdx + 1, 0, dragItem);

      dragId = null;
      renderBoard();
      persistBacklog();
    }

    function retryItem(id, e) {
      e.stopPropagation();
      const item = backlogData.items.find(i => i.id === id);
      if (!item) return;
      item.status = 'pending';
      item.in_sprint = true;
      delete item.story;
      delete item.acceptance_criteria;
      delete item.summary;
      delete item.diff;
      delete item.test_results;
      delete item.hermes_verdict;
      delete item.hermes_reason;
      delete item.deployed;
      renderBoard();
      persistBacklog();
    }

    function completeSprint() {
      backlogData.items.forEach(i => {
        if (i.in_sprint && (i.status === 'done' || i.status === 'failed')) i.in_sprint = false;
      });
      renderBoard();
      persistBacklog();
    }

    // ── Sprint ────────────────────────────────────────────────────────────────

    async function startSprint() {
      const btn = document.getElementById('start-btn');
      btn.disabled = true;
      btn.textContent = '⟳ Running...';

      const panel = document.getElementById('log-panel');
      panel.style.display = 'flex';

      const response = await fetch('/sprint/start', { method: 'POST' });

      if (!response.ok) {
        appendLog('Sprint start failed: ' + response.statusText, 'log-fail');
        btn.disabled = false;
        btn.textContent = '▶ Start Sprint';
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const msg = JSON.parse(part.slice(6));
          if (msg === '__done__') {
            appendLog('', '');
            appendLog('Sprint complete.', 'log-done');
            await loadBacklog();
            const stillPending = backlogData.items.some(i => i.in_sprint && i.status === 'pending');
            btn.disabled = !stillPending;
            btn.textContent = '▶ Start Sprint';
          } else {
            appendLog(msg);
          }
        }
      }
    }

    function appendLog(text, cls) {
      const out = document.getElementById('log-output');
      const div = document.createElement('div');
      div.className = 'log-line ' + (cls || colorClass(text));
      div.textContent = text;
      out.appendChild(div);
      out.scrollTop = out.scrollHeight;
    }

    function colorClass(line) {
      if (line.startsWith('PASS'))                          return 'log-pass';
      if (line.startsWith('FAIL') || line.includes('FAILED')) return 'log-fail';
      if (line.startsWith('Hermes: APPROVE'))               return 'log-hermes-approve';
      if (line.startsWith('Hermes: REJECT'))                return 'log-hermes-reject';
      if (line.startsWith('Deployed:') || line.startsWith('Live at')) return 'log-deploy';
      if (line.startsWith('==='))                           return 'log-section';
      return '';
    }

    function clearLog() {
      document.getElementById('log-output').innerHTML = '';
    }

    function deleteItem(id, e) {
      e.stopPropagation();
      backlogData.items = backlogData.items.filter(i => i.id !== id);
      renderBoard();
      persistBacklog();
    }

    function addItem(position) {
      const input = document.getElementById('new-idea');
      const idea = input.value.trim();
      if (!idea) return;
      const maxId = backlogData.items.reduce((m, i) => Math.max(m, i.id), 0);
      const newItem = { id: maxId + 1, idea, status: 'pending' };
      if (position === 'top') {
        backlogData.items.unshift(newItem);
      } else {
        backlogData.items.push(newItem);
      }
      input.value = '';
      renderBoard();
      persistBacklog();
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    loadBacklog();
  </script>
</body>
</html>
