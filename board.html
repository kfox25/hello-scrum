<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Backlog — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { display: flex; flex-direction: column; }
    header {
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #222;
      margin-top: 3.5rem;
    }
    header h1 { color: #00ff99; font-size: 1.4rem; }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      flex: 1;
      border-bottom: 1px solid #222;
    }

    .column {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
    }
    .column:last-child { border-right: none; }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #222;
      background: #141414;
    }
    .col-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
    }
    .col-count {
      font-size: 0.7rem;
      color: #666;
      margin-left: 0.5rem;
    }

    .sprint-btn {
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.3rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }
    #start-btn {
      background: #0d3320;
      color: #00ff99;
      border: 1px solid #00ff9960;
    }
    #start-btn:hover:not(:disabled) { background: #114428; border-color: #00ff99; }
    #start-slow-btn {
      background: #1a1200;
      color: #ffaa00;
      border: 1px solid #ffaa0060;
    }
    .bottom-actions {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      display: flex; gap: 0.5rem;
    }
    #restore-btn, #pending-btn {
      font-family: monospace; font-size: 0.75rem;
      background: #0b1f14; color: #00ff99; border: 1px solid #00ff9940;
      padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer;
    }
    #restore-btn:hover, #pending-btn:hover { background: #0d2a1a; }
    #delete-items-btn {
      font-family: monospace; font-size: 0.75rem;
      background: #1a0a0a; color: #ff4444; border: 1px solid #ff444430;
      padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer;
    }
    #delete-items-btn:hover { background: #2a0a0a; border-color: #ff444460; }
    #start-slow-btn:hover:not(:disabled) { background: #221800; border-color: #ffaa00; }
    #complete-btn {
      background: #1a1a1a;
      color: #888;
      border: 1px solid #33333360;
    }
    #complete-btn:hover:not(:disabled) { background: #222; color: #aaa; border-color: #555; }
    .sprint-btn:disabled { opacity: 0.3; cursor: not-allowed; }


    .drop-zone {
      flex: 1;
      padding: 1rem;
      min-height: 200px;
      transition: background 0.15s;
    }
    .drop-zone.drag-over { background: #161f18; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0;
      cursor: default;
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.4rem;
      padding-top: 0.35rem;
      border-top: 1px solid #1e1e1e;
    }
    .card.pending { cursor: grab; }
    .card.pending:active { cursor: grabbing; }
    .card.pending:hover { border-color: #3a3a3a; }
    .card.dragging { opacity: 0.4; }
    .card.insert-above { border-top: 2px solid #00ff99; }
    .card.insert-below { border-bottom: 2px solid #00ff99; }

    .drag-handle {
      color: #555;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .card.pending .drag-handle { color: #666; }
    .card.pending:hover .drag-handle { color: #00ff9980; }

    .card-content { flex: 1; display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
    .card-id   { font-size: 0.62rem; color: #333; font-family: monospace; }
    .card-idea { font-size: 0.9rem; color: #ccc; display: flex; align-items: baseline; gap: 0.4rem; }
    .card-story { font-size: 0.78rem; color: #888; line-height: 1.4; }
    .card-story.elaborating { color: #444; font-style: italic; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .card-content { cursor: default; }
    .card-ac { display: none; margin-top: 0.45rem; padding-top: 0.45rem; border-top: 1px solid #1e1e1e; }
    .card.expanded .card-ac { display: block; }
    .card-expand-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.3rem 0;
      margin-top: 0.5rem;
      border-top: 1px solid #2a2a2a;
      cursor: pointer;
      color: #555;
      font-size: 0.75rem;
      transition: color 0.15s;
      user-select: none;
    }
    .card-expand-btn:hover { color: #00ff9999; }
    .card-expand-btn .expand-arrow { display: inline-block; transition: transform 0.2s; }
    .card.expanded .card-expand-btn .expand-arrow { transform: rotate(180deg); }
    .ac-item { font-size: 0.73rem; color: #999; line-height: 1.6; display: flex; align-items: baseline; gap: 0.3rem; }
    .ac-item-text { flex: 1; }
    .ac-edit-btn { font-size: 0.65rem; background: none; border: none; color: #333; cursor: pointer; padding: 0; flex-shrink: 0; line-height: 1; }
    .ac-edit-btn:hover { color: #00ff99; }
    .ac-item-input { background: #111; border: 1px solid #00ff9940; color: #ccc; font-size: 0.73rem; font-family: inherit; padding: 0.1rem 0.3rem; border-radius: 3px; width: 100%; outline: none; resize: vertical; min-height: 3rem; line-height: 1.5; }

    .badge {
      font-size: 0.62rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      text-transform: capitalize;
      flex-shrink: 0;
    }
    .badge-done    { background: #0d3320; color: #00ff99; border: 1px solid #00ff9930; }
    .badge-pending { background: #1a1a00; color: #ffcc00; border: 1px solid #ffcc0030; }
    .badge-failed  { background: #2a0a0a; color: #ff4444; border: 1px solid #ff444430; }

.watercooler-tag {
      font-size: 0.62rem; padding: 0.1rem 0.4rem; border-radius: 3px; flex-shrink: 0;
      background: #0a1525; color: #4499cc; border: 1px solid #4499cc30;
    }
    .messenger-tag {
      font-size: 0.62rem; padding: 0.1rem 0.4rem; border-radius: 3px; flex-shrink: 0;
      background: #0f1a25; color: #5588ff; border: 1px solid #5588ff30;
    }
    .inception-tag {
      font-size: 0.62rem; padding: 0.1rem 0.4rem; border-radius: 3px; flex-shrink: 0;
      background: #1a0a1f; color: #cc88ff; border: 1px solid #cc88ff30;
    }
    .retry-btn {
      font-family: monospace;
      font-size: 0.85rem;
      background: none;
      border: 1px solid #333;
      color: #555;
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .retry-btn:hover { color: #ffcc00; border-color: #ffcc0060; }
    .delete-btn {
      font-family: monospace;
      font-size: 0.8rem;
      background: none;
      border: 1px solid #33222240;
      color: #442222;
      border-radius: 3px;
      padding: 0.1rem 0.35rem;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }
    .delete-btn:hover { color: #ff4444; border-color: #ff444460; }
    .edit-btn {
      font-family: monospace;
      font-size: 0.8rem;
      background: none;
      border: 1px solid #22334440;
      color: #224433;
      border-radius: 3px;
      padding: 0.1rem 0.35rem;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }
    .edit-btn:hover { color: #00ff99; border-color: #00ff9960; }
    .card-idea-input {
      background: #111;
      border: 1px solid #00ff9940;
      color: #ccc;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      width: 100%;
      outline: none;
    }

    .empty-hint {
      color: #555;
      font-size: 0.8rem;
      text-align: center;
      padding: 2rem 1rem;
    }
    .add-item {
      display: flex;
      gap: 0.4rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a1a1a;
    }
    .add-item input {
      flex: 1;
      font-family: monospace;
      font-size: 0.85rem;
      background: #111;
      color: #ccc;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 0.4rem 0.75rem;
      outline: none;
    }
    .add-item input::placeholder { color: #555; }
    .add-item input:focus { border-color: #00ff9940; }
    .add-item button {
      font-family: monospace;
      font-size: 0.8rem;
      background: #1a1a1a;
      color: #00ff99;
      border: 1px solid #00ff9930;
      border-radius: 4px;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-item button:hover { background: #0d3320; border-color: #00ff9960; }

    #log-output {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem 1.25rem;
      font-size: 0.78rem;
      line-height: 1.6;
    }
    .log-line { white-space: pre-wrap; color: #777; }
    .log-pass  { color: #00ff9990; }
    .log-fail  { color: #ff444490; }
    .log-hermes-approve { color: #00ff99; }
    .log-hermes-reject  { color: #ff4444; }
    .log-deploy { color: #fff; }
    .log-section { color: #00ff9960; }
    .log-done { color: #00ff99; font-weight: bold; }
  </style>
</head>

  <header>
    <h1>Product Backlog</h1>
  </header>

  <div class="board">
    <div class="column">
      <div class="col-header">
        <div>
          <span class="col-title">Opportunity Backlog</span>
          <span class="col-count" id="opp-count"></span>
        </div>
      </div>
      <div class="add-item">
        <input id="new-opp" placeholder="Add an opportunity..." onkeydown="if(event.key==='Enter')addOpportunity()" />
        <button onclick="addOpportunity()" title="Add opportunity">+</button>
      </div>
      <div class="drop-zone" id="opp-zone"
           ondragover="onDragOver(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event, 'opportunity')">
        <div class="empty-hint">Add opportunities here</div>
      </div>
    </div>

    <div class="column">
      <div class="col-header">
        <div>
          <span class="col-title">Story Backlog</span>
          <span class="col-count" id="backlog-count"></span>
        </div>
      </div>
      <div class="add-item">
        <input id="new-idea" placeholder="Add a story..." onkeydown="if(event.key==='Enter')addItem('top')" />
        <button onclick="addItem('top')" title="Add to backlog">+</button>
      </div>
      <div class="drop-zone" id="backlog-zone"
           ondragover="onDragOver(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event, 'backlog')">
        <div class="empty-hint">Product backlog items appear here</div>
      </div>
    </div>

    <div class="column">
      <div class="col-header">
        <div>
          <span class="col-title">Sprint Backlog</span>
          <span id="sprint-num" style="font-size:0.72rem;color:#888;font-family:monospace;margin-left:0.3rem;"></span>
          <span class="col-count" id="sprint-count"></span>
        </div>
        <div style="display:flex;gap:0.4rem">
          <button id="start-btn"      class="sprint-btn" onclick="startSprint(false)">▶ Start Sprint</button>
          <button id="start-slow-btn" class="sprint-btn" onclick="startSprint(true)">⏱ Slow Sprint</button>
          <button id="complete-btn"   class="sprint-btn" onclick="completeSprint()">✓ Complete Sprint</button>
        </div>
      </div>
      <div class="add-item">
        <input id="sprint-goal" placeholder="Sprint goal..." oninput="saveGoal()" />
      </div>
      <div class="drop-zone" id="sprint-zone"
           ondragover="onDragOver(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event, 'sprint')">
        <div class="empty-hint">Drag items here to add to sprint</div>
      </div>
    </div>
  </div>


  <div class="bottom-actions">
    <button id="delete-items-btn">Delete Sprint Items</button>
    <button id="restore-btn">Restore to Baseline</button>
    <button id="pending-btn">Mark Pending</button>
  </div>

  <script>
    let backlogData = null;
    let dragId = null;
    const expandedIds = new Set();

    function escHtml(s) {
      return (s == null ? '' : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function loadBacklog() {
      const res = await fetch('/backlog?t=' + Date.now());
      backlogData = await res.json();
      renderBoard();
      const hasResettable = (backlogData.items || []).some(i => i.in_sprint && (i.status === 'done' || i.status === 'failed'));
      const pbtn = document.getElementById('pending-btn');
      pbtn.disabled = !hasResettable;
      pbtn.style.opacity = hasResettable ? '' : '0.35';
      pbtn.style.cursor = hasResettable ? '' : 'default';
    }

    async function persistBacklog() {
      await fetch('/backlog', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(backlogData),
      });
    }

    function saveGoal() {
      backlogData.sprint_goal = document.getElementById('sprint-goal').value;
      persistBacklog();
    }

    function addOpportunity() {
      const input = document.getElementById('new-opp');
      const idea = input.value.trim();
      if (!idea) return;
      const maxId = backlogData.items.reduce((m, i) => Math.max(m, i.id), 0);
      backlogData.items.unshift({ id: maxId + 1, idea, status: 'pending', opportunity: true });
      input.value = '';
      renderBoard();
      persistBacklog();
    }

    function renderBoard() {
      const items = backlogData.items;
      const oppItems     = items.filter(i => i.opportunity);
      const backlogItems = items.filter(i => i.status === 'pending' && !i.in_sprint && !i.opportunity);
      const sprintItems  = items.filter(i => i.in_sprint);

      document.getElementById('opp-count').textContent     = `(${oppItems.length})`;
      document.getElementById('backlog-count').textContent = `(${backlogItems.length})`;
      document.getElementById('sprint-count').textContent  = `(${sprintItems.length})`;
      const sprintNumEl = document.getElementById('sprint-num');
      if (sprintNumEl) sprintNumEl.textContent = backlogData.sprint_number != null ? `#${backlogData.sprint_number}` : '';

      document.getElementById('opp-zone').innerHTML = oppItems.length
        ? oppItems.map(renderCard).join('')
        : '<div class="empty-hint">Add opportunities here</div>';

      document.getElementById('backlog-zone').innerHTML = backlogItems.length
        ? backlogItems.map(renderCard).join('')
        : '<div class="empty-hint">Detailed stories appear here</div>';

      document.getElementById('sprint-zone').innerHTML = sprintItems.length
        ? sprintItems.map(renderCard).join('')
        : '<div class="empty-hint">Drag items here to add to sprint</div>';

      const goalEl = document.getElementById('sprint-goal');
      if (goalEl && document.activeElement !== goalEl) {
        goalEl.value = backlogData.sprint_goal || '';
      }

      const hasPending    = sprintItems.some(i => i.status === 'pending');
      const hasFinished   = sprintItems.some(i => i.status === 'done' || i.status === 'failed');
      document.getElementById('start-btn').disabled      = !hasPending;
      document.getElementById('start-slow-btn').disabled = !hasPending;
      document.getElementById('complete-btn').disabled   = !hasFinished;
    }

    function renderCard(item) {
      const isPending = item.status === 'pending';
      const draggable = isPending ? 'draggable="true"' : '';
      const handle    = isPending ? '<span class="drag-handle">&#8942;&#8942;</span>' : '<span class="drag-handle"></span>';


      const retryBtn = item.status === 'failed'
        ? `<button class="retry-btn" onclick="retryItem('${item.id}', event)" title="Reset to pending">↺</button>`
        : '';

      const deleteBtn = isPending && !item.in_sprint
        ? `<button class="delete-btn" onclick="deleteItem('${item.id}', event)" title="Delete">✕</button>`
        : '';

      const editBtn = isPending && !item.in_sprint
        ? `<button class="ac-edit-btn" onclick="editIdea('${item.id}', event)" title="Edit">✎</button>`
        : '';

      const hasAC = !!(item.acceptance_criteria && item.acceptance_criteria.length);
      const isExpanded = expandedIds.has(String(item.id));

      let storyLine = '';
      if (item.elaborating) {
        storyLine = '<div class="card-story elaborating">generating story...</div>';
      } else if (item.elaborate_error) {
        storyLine = `<div class="card-story" style="color:#ff6666;font-style:italic;">elaboration failed: ${escHtml(item.elaborate_error.slice(0, 120))}</div>`;
      } else if (item.story) {
        storyLine = `<div class="card-story">${escHtml(item.story)}</div>`;
      }

      const sourceTag = item.source === 'team_chat'
        ? `<span class="messenger-tag">Team Chat</span>`
        : item.source === 'inception'
        ? `<span class="inception-tag">Inception</span>`
        : (item.meeting_update || item.source === 'watercooler')
        ? `<span class="watercooler-tag" title="${escHtml(item.meeting_update || 'Added from watercooler')}">Watercooler</span>`
        : '';
      const wcTag = sourceTag;
      const acHtml = hasAC
        ? `<div class="card-ac">${item.acceptance_criteria.map((c, idx) => `
          <div class="ac-item">
            <span class="ac-item-text">· ${escHtml(c)}</span>
            ${isPending && !item.in_sprint ? `<button class="ac-edit-btn" onclick="editAC('${item.id}',${idx},event)" title="Edit">✎</button>` : ''}
          </div>`).join('')}</div>`
        : '';

      const expandBtn = hasAC
        ? `<div class="card-expand-btn" onclick="toggleCard('${item.id}', event)"><span class="expand-arrow">&#9660;</span></div>`
        : '';

      return `<div class="card ${item.status}${isExpanded ? ' expanded' : ''}" data-id="${item.id}" ${draggable}
                   ondragstart="onDragStart(event)"
                   ondragend="onDragEnd(event)"
                   ondragover="onCardDragOver(event)"
                   ondragleave="onCardDragLeave(event)"
                   ondrop="onCardDrop(event)">
        <div class="card-top">
          ${handle}
          <div class="card-content">
            <div class="card-idea"><span>${escHtml(item.idea)}</span>${editBtn}</div>
            <div class="card-id">#${item.id}</div>
            ${storyLine}
            ${acHtml}
            ${expandBtn}
          </div>
          ${retryBtn}
          ${deleteBtn}
        </div>
        <div class="card-footer">
          ${sourceTag}
          <span class="badge badge-${item.status}">${item.status}</span>
        </div>
      </div>`;
    }

    function toggleCard(id, e) {
      e.stopPropagation();
      const sid = String(id);
      if (expandedIds.has(sid)) expandedIds.delete(sid); else expandedIds.add(sid);
      const card = document.querySelector(`.card[data-id="${sid}"]`);
      if (card) card.classList.toggle('expanded', expandedIds.has(sid));
    }

    // ── Drag and drop ─────────────────────────────────────────────────────────

    function onDragStart(e) {
      dragId = String(e.currentTarget.dataset.id);
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-over');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onDrop(e, dest) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (dragId === null) return;

      const item = backlogData.items.find(i => String(i.id) === dragId);
      if (!item || item.status !== 'pending') return;

      const wasOpportunity = !!item.opportunity;

      if (dest === 'opportunity') {
        item.opportunity = true;
        item.in_sprint = false;
      } else if (dest === 'backlog') {
        delete item.opportunity;
        item.in_sprint = false;
        if (wasOpportunity) elaborateStory(item.id);
      } else if (dest === 'sprint') {
        delete item.opportunity;
        item.in_sprint = true;
      }
      dragId = null;
      renderBoard();
      persistBacklog();
    }

    function onCardDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      const card = e.currentTarget;
      const mid = card.getBoundingClientRect().top + card.getBoundingClientRect().height / 2;
      card.classList.toggle('insert-above', e.clientY < mid);
      card.classList.toggle('insert-below', e.clientY >= mid);
    }

    function onCardDragLeave(e) {
      e.currentTarget.classList.remove('insert-above', 'insert-below');
    }

    function onCardDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      const card = e.currentTarget;
      const insertBefore = card.classList.contains('insert-above');
      card.classList.remove('insert-above', 'insert-below');

      if (dragId === null) return;
      const targetId = String(card.dataset.id);
      if (dragId === targetId) return;

      const items = backlogData.items;
      const dragItem  = items.find(i => String(i.id) === dragId);
      const targetItem = items.find(i => String(i.id) === targetId);
      if (!dragItem || dragItem.status !== 'pending') return;

      const wasOpportunity = !!dragItem.opportunity;

      // move to same column as target
      if (targetItem.opportunity) {
        dragItem.opportunity = true;
        dragItem.in_sprint = false;
      } else if (targetItem.in_sprint) {
        delete dragItem.opportunity;
        dragItem.in_sprint = true;
      } else {
        delete dragItem.opportunity;
        dragItem.in_sprint = false;
        if (wasOpportunity) elaborateStory(dragItem.id);
      }

      // reorder in array
      const srcIdx = items.indexOf(dragItem);
      items.splice(srcIdx, 1);
      const tgtIdx = items.indexOf(targetItem);
      items.splice(insertBefore ? tgtIdx : tgtIdx + 1, 0, dragItem);

      dragId = null;
      renderBoard();
      persistBacklog();
    }

    function retryItem(id, e) {
      e.stopPropagation();
      const item = backlogData.items.find(i => String(i.id) === String(id));
      if (!item) return;
      item.status = 'pending';
      item.in_sprint = true;
      delete item.summary;
      delete item.diff;
      delete item.test_results;
      delete item.hermes_verdict;
      delete item.hermes_reason;
      delete item.deployed;
      renderBoard();
      persistBacklog();
    }

    function completeSprint() {
      backlogData.items.forEach(i => {
        if (i.in_sprint && (i.status === 'done' || i.status === 'failed')) i.in_sprint = false;
      });
      renderBoard();
      persistBacklog();
    }

    // ── Sprint ────────────────────────────────────────────────────────────────

    async function startSprint(slowMode = false) {
      const btn = document.getElementById('start-btn');
      const slowBtn = document.getElementById('start-slow-btn');
      btn.disabled = true;
      slowBtn.disabled = true;
      btn.textContent = '⟳ Running...';

      await fetch('/slow-mode/set', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({enabled: slowMode}) });

      const response = await fetch('/sprint/start', { method: 'POST' });

      if (!response.ok) {
        btn.disabled = false;
        btn.textContent = '▶ Start Sprint';
        return;
      }

      window.location.href = 'active.html';
    }

    function deleteItem(id, e) {
      e.stopPropagation();
      backlogData.items = backlogData.items.filter(i => String(i.id) !== String(id));
      renderBoard();
      persistBacklog();
    }

    function editIdea(id, e) {
      e.stopPropagation();
      const item = backlogData.items.find(i => String(i.id) === String(id));
      if (!item) return;
      const card = document.querySelector(`.card[data-id="${id}"]`);
      const ideaEl = card.querySelector('.card-idea');
      const input = document.createElement('input');
      input.type = 'text';
      input.value = item.idea;
      input.className = 'card-idea-input';
      ideaEl.querySelector('span').replaceWith(input);
      input.focus();
      input.select();
      function save() {
        const val = input.value.trim();
        if (val && val !== item.idea) {
          item.idea = val;
          persistBacklog();
        }
        renderBoard();
      }
      input.addEventListener('blur', save);
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') input.blur();
        if (ev.key === 'Escape') renderBoard();
      });
    }

    function editAC(id, idx, e) {
      e.stopPropagation();
      const item = backlogData.items.find(i => String(i.id) === String(id));
      if (!item || !item.acceptance_criteria) return;
      const card = document.querySelector(`.card[data-id="${id}"]`);
      const acItems = card.querySelectorAll('.ac-item');
      const acItem = acItems[idx];
      const textEl = acItem.querySelector('.ac-item-text');
      const input = document.createElement('textarea');
      input.value = item.acceptance_criteria[idx];
      input.className = 'ac-item-input';
      acItem.replaceWith(input);
      input.focus();
      input.select();
      function save() {
        const val = input.value.trim();
        if (val) item.acceptance_criteria[idx] = val;
        persistBacklog();
        renderBoard();
        const updatedCard = document.querySelector(`.card[data-id="${id}"]`);
        if (updatedCard && !updatedCard.classList.contains('expanded')) {
          updatedCard.classList.add('expanded');
          expandedIds.add(String(id));
        }
      }
      input.addEventListener('blur', save);
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Escape') renderBoard();
      });
    }

    function addItem(position) {
      const input = document.getElementById('new-idea');
      const idea = input.value.trim();
      if (!idea) return;
      const maxId = backlogData.items.reduce((m, i) => Math.max(m, i.id), 0);
      const newItem = { id: maxId + 1, idea, status: 'pending' };
      if (position === 'sprint') {
        newItem.in_sprint = true;
        let lastSprintIdx = -1;
        for (let i = 0; i < backlogData.items.length; i++) {
          if (backlogData.items[i].in_sprint) lastSprintIdx = i;
        }
        if (lastSprintIdx === -1) {
          backlogData.items.unshift(newItem);
        } else {
          backlogData.items.splice(lastSprintIdx + 1, 0, newItem);
        }
      } else if (position === 'top') {
        backlogData.items.unshift(newItem);
      } else {
        backlogData.items.push(newItem);
      }
      input.value = '';
      renderBoard();
      persistBacklog();
      if (position === 'top') elaborateStory(newItem.id);
    }

    // ── Story elaboration ─────────────────────────────────────────────────────

    async function elaborateStory(id) {
      const item = backlogData.items.find(i => String(i.id) === String(id));
      if (!item) return;
      item.elaborating = true;
      renderBoard();

      try {
        const res = await fetch('/backlog/elaborate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: item.id, idea: item.idea }),
        });
        const data = await res.json();
        delete item.elaborating;
        if (data.error) {
          item.elaborate_error = data.error;
        } else {
          delete item.elaborate_error;
          if (data.story) item.story = data.story;
          if (data.acceptance_criteria) item.acceptance_criteria = data.acceptance_criteria;
        }
      } catch (err) {
        delete item.elaborating;
        item.elaborate_error = String(err);
      }
      renderBoard();
      persistBacklog();
    }


    // ── Baseline restore ──────────────────────────────────────────────────────
    async function checkBaselineStatus() {
      try {
        const res = await fetch('/baseline/status');
        const d = await res.json();
        const btn = document.getElementById('restore-btn');
        btn.disabled = d.at_baseline;
        btn.style.opacity = d.at_baseline ? '0.35' : '';
        btn.style.cursor = d.at_baseline ? 'default' : '';
      } catch(e) {}
    }
    document.getElementById('delete-items-btn').addEventListener('click', async () => {
      if (!confirm('Delete all sprint items (pending, done, and failed)? This cannot be undone.')) return;
      const btn = document.getElementById('delete-items-btn');
      btn.textContent = 'deleting…'; btn.disabled = true;
      try {
        const r = await fetch('/sprint/delete-items', { method: 'POST' });
        const d = await r.json();
        btn.textContent = d.ok ? 'deleted ✓' : 'failed';
        setTimeout(() => { btn.textContent = 'Delete Sprint Items'; btn.disabled = false; loadBoard(); }, 1500);
      } catch(e) { btn.textContent = 'error'; btn.disabled = false; }
    });

    document.getElementById('restore-btn').addEventListener('click', async () => {
      const btn = document.getElementById('restore-btn');
      btn.textContent = 'restoring…'; btn.disabled = true;
      try {
        const r = await fetch('/baseline/restore', { method: 'POST' });
        const d = await r.json();
        btn.textContent = d.ok ? 'restored ✓' : 'failed';
        setTimeout(() => { btn.textContent = 'Restore to Baseline'; checkBaselineStatus(); }, 2000);
      } catch(e) { btn.textContent = 'error'; btn.disabled = false; }
    });
    checkBaselineStatus();

    document.getElementById('pending-btn').addEventListener('click', async () => {
      const btn = document.getElementById('pending-btn');
      btn.textContent = 'marking…'; btn.disabled = true;
      try {
        const r = await fetch('/backlog/mark-pending', { method: 'POST' });
        const d = await r.json();
        btn.textContent = d.ok ? `reset ${d.count} ✓` : 'failed';
        setTimeout(() => { btn.textContent = 'Mark Pending'; btn.disabled = false; loadBacklog(); }, 2000);
      } catch(e) { btn.textContent = 'error'; btn.disabled = false; }
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    fetch('/sprint/status').then(r => r.json()).then(d => {
      if (d.running) {
        document.getElementById('start-btn').disabled      = true;
        document.getElementById('start-slow-btn').disabled = true;
        document.getElementById('start-btn').textContent   = '⟳ Running...';
      }
    }).catch(() => {});
    loadBacklog();
  </script>
<script src="shared.js"></script></body>
