<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 4.5rem 2rem 3rem; }

    .section { margin-bottom: 2rem; }
    h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #999;
      margin: 0 0 0.75rem;
    }

    /* ── status row ── */
    .status-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .status-row .section { margin-bottom: 0; }

    /* ── detail rows ── */
    .detail-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .detail-row .section { margin-bottom: 0; }

    @media (max-width: 640px) {
      .status-row, .detail-row { grid-template-columns: 1fr; }
    }

    /* ── stat cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.6rem;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 0.8rem 1rem;
    }
    .card-label { font-size: 0.62rem; color: #999; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.3rem; }
    .card-value { font-size: 1.5rem; font-family: monospace; color: #ccc; }
    .card-value.green  { color: #00ff99; }
    .card-value.yellow { color: #ffcc00; }
    .card-value.red    { color: #ff4444; }
    .card-sub { font-size: 0.68rem; color: #999; margin-top: 0.2rem; }
    .bar-wrap { height: 4px; background: #1a1a1a; border-radius: 2px; overflow: hidden; margin-top: 0.6rem; }
    .bar { height: 100%; border-radius: 2px; background: #00ff99; transition: width 0.4s; }
    .bar.yellow { background: #ffcc00; }
    .bar.red    { background: #ff4444; }

    /* ── check rows ── */
    .check-list {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      border-top: 1px solid #1a1a1a;
      font-size: 0.8rem;
    }
    .check-row:first-child { border-top: none; }
    .check-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .check-dot.pass  { background: #00ff99; }
    .check-dot.fail  { background: #ff4444; }
    .check-dot.warn  { background: #ffcc00; }
    .check-name { color: #999; flex: 1; }
    .check-detail { font-size: 0.72rem; color: #999; }

    /* ── sprint trend ── */
    .trend-wrap {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 1rem 1.2rem;
    }
    .trend-dots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.5rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; cursor: default; position: relative; }
    .dot.done   { background: #00ff99; }
    .dot.failed { background: #ff4444; }
    .dot:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      background: #222; border: 1px solid #333; border-radius: 4px;
      padding: 3px 7px; font-size: 0.65rem; color: #999;
      white-space: nowrap; z-index: 10;
    }
    .trend-legend { font-size: 0.65rem; color: #999; }


    /* ── rejection bars ── */
    .pattern-list {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .pattern-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.35rem 0; border-top: 1px solid #1a1a1a;
    }
    .pattern-row:first-child { border-top: none; }
    .pattern-label { font-size: 0.75rem; color: #999; min-width: 150px; }
    .pattern-bar-bg { flex: 1; height: 5px; background: #1a1a1a; border-radius: 3px; overflow: hidden; }
    .pattern-bar-fill { height: 100%; background: #4488ff; border-radius: 3px; }
    .pattern-count { font-size: 0.72rem; color: #999; font-family: monospace; min-width: 20px; text-align: right; }

    .empty-note { font-size: 0.75rem; color: #999; padding: 0.5rem 0; }

    /* ── velocity table ── */
    .vel-table {
      width: 100%; border-collapse: collapse; font-size: 0.78rem;
      background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden;
    }
    .vel-table th {
      text-align: left; color: #999; font-size: 0.65rem;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 0.4rem 0.75rem; border-bottom: 1px solid #222;
    }
    .vel-table td {
      padding: 0.4rem 0.75rem; color: #999; border-bottom: 1px solid #161616;
    }
    .vel-table tr:last-child td { border-bottom: none; }
    .vel-pass { color: #00ff99; }
    .vel-warn { color: #ffcc00; }
    .vel-fail { color: #ff4444; }

    #restore-btn {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      font-family: monospace; font-size: 0.75rem;
      background: #0b1f14; color: #00ff99; border: 1px solid #00ff9940;
      padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer;
    }
    #restore-btn:hover { background: #0d2a1a; }

    /* ── readiness banner ── */
    .readiness-banner {
      display: flex; align-items: center; justify-content: space-between;
      background: #111; border: 1px solid #222; border-radius: 8px;
      padding: 0.75rem 1rem; margin-bottom: 0.5rem;
    }
    .readiness-status { font-family: monospace; font-size: 1rem; letter-spacing: 0.08em; }
    .readiness-status.ready     { color: #00ff99; }
    .readiness-status.not-ready { color: #ff4444; }
    .readiness-status.checking  { color: #999; }
    .readiness-refresh {
      font-size: 0.72rem; color: #999; background: none;
      border: 1px solid #222; border-radius: 4px;
      padding: 0.2rem 0.6rem; cursor: pointer;
    }
    .readiness-refresh:hover { color: #ccc; border-color: #333; }

    /* ── impediment list ── */
    .imp-list { background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
    .imp-row {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.65rem 1rem; border-top: 1px solid #1a1a1a;
    }
    .imp-row:first-child { border-top: none; }
    .imp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .imp-dot.critical { background: #ff4444; }
    .imp-dot.warning  { background: #ffcc00; }
    .imp-label { font-size: 0.8rem; color: #ccc; font-weight: 500; min-width: 130px; }
    .imp-detail { font-size: 0.75rem; color: #999; flex: 1; line-height: 1.4; }
    .imp-clear { font-size: 0.8rem; color: #00ff99; padding: 0.75rem 1rem; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="messenger.html">Messenger</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="prompts.html">Prompts</a>
    <a href="notes.html">Notes</a>
    <a href="health.html">Health</a>
  </nav>

  <div class="status-row">
    <div class="section">
      <h2>System Readiness</h2>
      <div class="readiness-banner">
        <span class="readiness-status checking" id="readiness-status">Checking…</span>
        <button class="readiness-refresh" id="readiness-refresh">↺ Refresh</button>
      </div>
      <div class="check-list" id="readiness-checks"></div>
    </div>
    <div class="section">
      <h2>Impediment Radar</h2>
      <div class="imp-list" id="imp-list"></div>
    </div>
  </div>

  <button id="restore-btn">Restore to Baseline</button>

  <div class="section">
    <h2>Pipeline Metrics</h2>
    <div class="cards" id="metrics-cards"></div>
  </div>

  <div class="detail-row">
    <div class="section">
      <h2>Sprint History</h2>
      <table class="vel-table" id="velocity-table">
        <thead>
          <tr><th>Date</th><th>Stories</th><th>Done</th><th>Pass %</th><th>Avg Cycle</th></tr>
        </thead>
        <tbody id="velocity-rows"></tbody>
      </table>
    </div>
    <div class="section">
      <h2>Sprint Trend</h2>
      <div class="trend-wrap">
        <div class="trend-dots" id="trend-dots"></div>
        <div class="trend-legend" id="trend-legend"></div>
      </div>
    </div>
  </div>

  <div class="detail-row">
    <div class="section">
      <h2>Rejection Patterns</h2>
      <div class="pattern-list" id="rejection-patterns"></div>
    </div>
    <div class="section">
      <h2>Configuration &amp; CSS</h2>
      <div class="check-list" id="config-checks"></div>
      <div class="check-list" style="margin-top:0.6rem" id="css-checks"></div>
    </div>
  </div>



  <script>
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function card(label, value, cls, sub, barPct, barCls) {
      const bar = barPct != null
        ? `<div class="bar-wrap"><div class="bar ${barCls||''}" style="width:${barPct}%"></div></div>`
        : '';
      return `<div class="card">
        <div class="card-label">${esc(label)}</div>
        <div class="card-value ${cls||''}">${esc(String(value))}</div>
        ${sub ? `<div class="card-sub">${esc(sub)}</div>` : ''}
        ${bar}
      </div>`;
    }

    function checkRow(name, pass, detail, warn) {
      const dotCls = warn ? 'warn' : pass ? 'pass' : 'fail';
      return `<div class="check-row">
        <div class="check-dot ${dotCls}"></div>
        <div class="check-name">${esc(name)}</div>
        ${detail ? `<div class="check-detail">${esc(detail)}</div>` : ''}
      </div>`;
    }

    function fmtCycle(s) {
      if (s == null) return '—';
      if (s < 60) return s + 's';
      return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
    }

    function fmtDate(s) {
      if (!s) return '—';
      return s.slice(0, 10);
    }

    async function loadReadiness() {
      const statusEl = document.getElementById('readiness-status');
      const checksEl = document.getElementById('readiness-checks');
      statusEl.textContent = 'Checking…';
      statusEl.className = 'readiness-status checking';
      checksEl.innerHTML = '';
      try {
        const r = await fetch('/health/readiness');
        const d = await r.json();
        statusEl.textContent = d.ready ? '● SYSTEM READY' : '● NOT READY';
        statusEl.className = 'readiness-status ' + (d.ready ? 'ready' : 'not-ready');
        checksEl.innerHTML = (d.checks || []).map(c => checkRow(c.name, c.pass, c.detail)).join('');
      } catch (e) {
        statusEl.textContent = '● CHECK FAILED';
        statusEl.className = 'readiness-status not-ready';
        checksEl.innerHTML = checkRow('Server error', false, e.message);
      }
    }

    async function loadImpediments() {
      const el = document.getElementById('imp-list');
      try {
        const r = await fetch('/health/impediments');
        const d = await r.json();
        if (d.clear) {
          el.innerHTML = '<div class="imp-clear">● No impediments detected</div>';
          return;
        }
        el.innerHTML = (d.impediments || []).map(i => `
          <div class="imp-row">
            <div class="imp-dot ${esc(i.severity)}"></div>
            <div class="imp-label">${esc(i.label)}</div>
            <div class="imp-detail">${esc(i.detail)}</div>
          </div>`).join('');
      } catch(e) {
        el.innerHTML = '<div class="imp-clear" style="color:#999">Could not load</div>';
      }
    }

    async function loadAll() {
      const [diagRes, healthRes, velRes] = await Promise.all([
        fetch('/health/diagnostics'),
        fetch('/health'),
        fetch('/health/velocity'),
      ]);
      const diag   = await diagRes.json();
      const health = await healthRes.json();
      const vel    = await velRes.json();

      // ── Pipeline Metrics bar ───────────────────────────────────────────────
      const hm = diag.hermes || {};
      const approveCol    = hm.approve_rate >= 70 ? 'green' : hm.approve_rate >= 40 ? 'yellow' : 'red';
      const approveBarCls = hm.approve_rate >= 70 ? ''      : hm.approve_rate >= 40 ? 'yellow' : 'red';
      const passCol = vel.pass_rate_30d >= 80 ? 'green' : vel.pass_rate_30d >= 50 ? 'yellow' : 'red';
      const hCol = health.status === 'healthy' ? 'green' : health.status === 'warning' ? 'yellow' : 'red';
      const bCol = health.status === 'healthy' ? ''      : health.status === 'warning' ? 'yellow' : 'red';
      const pct  = Math.min(100, Math.round((health.kb / 24) * 100));

      document.getElementById('metrics-cards').innerHTML =
        card('Avg Cycle Time',   fmtCycle(vel.avg_cycle_s), '', 'last 10 stories') +
        card('Pass Rate (30d)',  vel.pass_rate_30d != null ? vel.pass_rate_30d + '%' : '—', passCol,
          `${vel.total_done || 0} of ${vel.total_processed || 0} shipped`) +
        card('Hermes Approve',   (hm.approve_rate ?? 0) + '%', approveCol,
          `${hm.approved ?? 0} / ${hm.total_reviewed ?? 0} reviewed`,
          hm.approve_rate ?? 0, approveBarCls) +
        card('Sprint Runs',      vel.sprint_count ?? '—', '') +
        card('File Size',        (health.kb || 0) + ' KB', hCol,
          `${pct}% of 24 KB budget`, pct, bCol);

      // ── Sprint History table ───────────────────────────────────────────────
      const rows = (vel.recent_sprints || []).reverse().map(s => {
        const pCol = s.pass_rate >= 80 ? 'vel-pass' : s.pass_rate >= 50 ? 'vel-warn' : 'vel-fail';
        return `<tr>
          <td>${esc(s.date)}</td>
          <td>${s.stories}</td>
          <td>${s.done}</td>
          <td class="${pCol}">${s.pass_rate}%</td>
          <td>${fmtCycle(s.avg_cycle_s)}</td>
        </tr>`;
      }).join('');
      document.getElementById('velocity-rows').innerHTML =
        rows || '<tr><td colspan="5" style="color:#999">No sprint history</td></tr>';

      // ── Sprint Trend ───────────────────────────────────────────────────────
      const trend = diag.sprint_trend || [];
      let dotsHtml = '', doneN = 0, failN = 0;
      for (const s of trend) {
        dotsHtml += `<div class="dot ${s.status}" data-tip="${esc(s.idea || s.status)}"></div>`;
        s.status === 'done' ? doneN++ : failN++;
      }
      if (!trend.length) dotsHtml = '<div style="font-size:0.75rem;color:#999">No sprint history yet</div>';
      document.getElementById('trend-dots').innerHTML = dotsHtml;
      document.getElementById('trend-legend').textContent =
        trend.length ? `Last ${trend.length} — ${doneN} done · ${failN} failed` : '';

      // ── Rejection Patterns ─────────────────────────────────────────────────
      const rp = diag.rejection_patterns || {};
      const rpEntries = Object.entries(rp).filter(([k]) => k !== 'error');
      const rpMax = rpEntries.reduce((m, [, v]) => Math.max(m, v), 1);
      document.getElementById('rejection-patterns').innerHTML = rpEntries.length
        ? rpEntries.map(([label, count]) => `
            <div class="pattern-row">
              <div class="pattern-label">${esc(label)}</div>
              <div class="pattern-bar-bg">
                <div class="pattern-bar-fill" style="width:${Math.round((count / rpMax) * 100)}%"></div>
              </div>
              <div class="pattern-count">${count}</div>
            </div>`).join('')
        : `<div class="empty-note">No rejection patterns recorded yet</div>`;

      // ── Configuration + CSS ────────────────────────────────────────────────
      const cfg = diag.config || {};
      let cfgHtml = '';
      for (const key of ['CODING_WISDOM_FILE', 'AC_WISDOM_FILE', 'RETRO_FILE']) {
        const c = cfg[key] || {};
        cfgHtml += checkRow(key, c.exists,
          c.value ? (c.exists ? c.value : `${c.value} — FILE NOT FOUND`) : 'not found in agent.py');
      }
      document.getElementById('config-checks').innerHTML = cfgHtml;

      const css = diag.css_checks || [];
      document.getElementById('css-checks').innerHTML =
        css.map(c => checkRow(c.name, c.pass, c.detail)).join('') ||
        '<div class="check-row"><div class="check-name" style="color:#999">No data</div></div>';


    }


    async function loadHealthWidget() {
      try {
        const res = await fetch('/health/score');
        const d   = await res.json();
        const statusColor = d.status === 'healthy'  ? '#00ff99'
                          : d.status === 'warning'  ? '#ffcc00'
                          : '#ff4444';
        function dotCls(s) { return s === 'healthy' ? 'green' : s === 'warning' ? 'yellow' : 'red'; }
        function row(label, status) {
          return `<div class="hw-row"><div class="hw-dot ${dotCls(status)}"></div><span>${esc(label)}</span></div>`;
        }
        const fileLabel     = d.file_kb       != null ? `File ${d.file_kb} KB`                                           : 'File —';
        const hermesLabel   = d.hermes_rate   != null ? `Hermes ${d.hermes_rate}%`                                        : 'Hermes —';
        const cycleLabel    = d.cycle_pct     != null ? `Cycle +${d.cycle_pct}% slower`                                  : null;
        const velocityLabel = d.velocity_bps  != null ? `Velocity ${d.velocity_bps > 0 ? '+' : ''}${d.velocity_bps}B/story` : null;
        const cssLabel      = d.css_drift               ? 'CSS drift detected'                                            : null;
        const wisdomLabel   = d.wisdom_total  != null && d.wisdom_flagged > 0
                              ? `Wisdom ${d.wisdom_flagged}/${d.wisdom_total} flagged` : null;
        const widget = document.createElement('div');
        widget.id = 'health-widget';
        widget.innerHTML = `
          <div class="hw-status" style="color:${statusColor}">● ${d.status}</div>
          ${row(fileLabel,   d.file_status     || 'healthy')}
          ${row(hermesLabel, d.hermes_status   || 'healthy')}
          ${cycleLabel    ? row(cycleLabel,    d.cycle_status    || 'healthy') : ''}
          ${velocityLabel ? row(velocityLabel, d.velocity_status || 'healthy') : ''}
          ${cssLabel      ? row(cssLabel,      d.css_status      || 'healthy') : ''}
          ${wisdomLabel   ? row(wisdomLabel,   d.wisdom_status   || 'healthy') : ''}
        `;
        document.body.appendChild(widget);
      } catch(e) {}
    }

    async function checkBaselineStatus() {
      try {
        const res = await fetch('/baseline/status');
        const d = await res.json();
        const btn = document.getElementById('restore-btn');
        btn.disabled = d.at_baseline;
        btn.style.opacity = d.at_baseline ? '0.35' : '';
        btn.style.cursor = d.at_baseline ? 'default' : '';
      } catch(e) {}
    }
    document.getElementById('restore-btn').addEventListener('click', async () => {
      const btn = document.getElementById('restore-btn');
      btn.textContent = 'restoring…'; btn.disabled = true;
      try {
        const r = await fetch('/baseline/restore', { method: 'POST' });
        const d = await r.json();
        btn.textContent = d.ok ? 'restored ✓' : 'failed';
        setTimeout(() => { btn.textContent = 'Restore to Baseline'; checkBaselineStatus(); }, 2000);
      } catch(e) { btn.textContent = 'error'; btn.disabled = false; }
    });
    checkBaselineStatus();

    document.getElementById('readiness-refresh').addEventListener('click', loadReadiness);
    loadReadiness();
    loadImpediments();
    loadAll();
    loadHealthWidget();
  </script>
<script src="shared.js"></script></body>
</html>
