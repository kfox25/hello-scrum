<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Inception — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 4rem 2rem 3rem; min-height: 100vh; display: flex; flex-direction: column; }

    .page-header { margin-bottom: 2rem; }
    h1 { color: #00ff99; font-size: 1.8rem; margin-bottom: 0.25rem; }
    .page-sub { color: #888; font-size: 0.85rem; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 720px;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 0.5rem;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      padding: 0.75rem;
      box-sizing: border-box;
      resize: vertical;
    }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: #00ff9940; }
    textarea::placeholder, input::placeholder { color: #666; }

    .btn {
      background: #0a1f12;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.55rem 1.25rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .btn:hover { border-color: #00ff99; background: #0d2a1a; }
    .btn:disabled { opacity: 0.4; cursor: default; border-color: #00ff9920; }

    .btn-copy {
      background: #0a0f1f;
      color: #4488ff;
      border: 1px solid #4488ff40;
    }
    .btn-copy:hover { border-color: #4488ff; background: #0d1530; }

    /* ── State: intent ── */
    #stateIntent { display: flex; flex-direction: column; gap: 1rem; }

    /* ── State: questions ── */
    #stateQuestions { display: none; flex-direction: column; gap: 1.5rem; }

    .qna-item { display: flex; flex-direction: column; gap: 0.4rem; }
    .question-text {
      font-size: 0.88rem;
      color: #ccc;
      line-height: 1.55;
      padding: 0.6rem 0.75rem;
      background: #0a1f12;
      border: 1px solid #00ff9920;
      border-radius: 4px;
    }
    .question-text::before {
      content: 'Q  ';
      color: #00ff99;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .qna-actions { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.5rem; }

    /* ── State: result ── */
    #stateResult { display: none; }
    #stateResult .result-layout { width: 100%; }

    .result-layout { display: flex; gap: 1.5rem; align-items: flex-start; }
    .result-left  { flex: 0 0 300px; max-width: none; display: flex; flex-direction: column; gap: 0.75rem; }
    .result-right { flex: 1; min-width: 0; max-width: none; display: flex; flex-direction: column; gap: 0.75rem; }

    .qna-readonly { display: flex; flex-direction: column; gap: 0.6rem; }
    .qna-readonly-item { font-size: 0.82rem; line-height: 1.5; }
    .qna-q { color: #00ff9980; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.15rem; }
    .qna-a { color: #bbb; }

    .ac-inputs { display: flex; flex-direction: column; gap: 0.4rem; }
    .ac-input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .ac-input-row textarea { flex: 1; min-width: 0; resize: none; rows: 2; }
    .ac-check { color: #00ff9960; font-size: 0.75rem; flex-shrink: 0; }

    .result-actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .copy-confirm { font-size: 0.78rem; color: #00ff9980; display: none; }

    .btn-clear {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #1a0a0a;
      color: #ff4444;
      border: 1px solid #ff444430;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85rem;
      z-index: 100;
    }
    .btn-clear:hover { border-color: #ff4444; background: #2a0a0a; }

    .spinner {
      display: inline-block;
      width: 0.75rem; height: 0.75rem;
      border: 2px solid #00ff9930;
      border-top-color: #00ff99;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-line {
      font-size: 0.78rem;
      color: #888;
      min-height: 1.2rem;
    }
    .status-line.active { color: #00ff9980; }
    .status-line.error { color: #ff4444; }

    .intent-display {
      font-size: 0.8rem;
      color: #777;
      font-style: italic;
      padding: 0.4rem 0.75rem;
      border-left: 2px solid #2a2a2a;
      margin-bottom: 0.25rem;
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 0.6rem;
    }

    .restart-link {
      font-size: 0.78rem;
      color: #777;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
      font-family: monospace;
    }
    .restart-link:hover { color: #888; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="messenger.html">Messenger</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="prompts.html">Prompts</a>
    <a href="notes.html">Notes</a>
    <a href="health.html">Health</a>
  </nav>

  <div class="page-header">
    <h1>Inception</h1>
    <div class="page-sub">AI-DLC clarifying questions → sharper story + AC</div>
  </div>

  <!-- State 1: Intent input -->
  <div id="stateIntent">
    <div class="card">
      <div class="label">Intent</div>
      <textarea id="intentInput" rows="3" placeholder="Describe what you want to build or change at a high level..."></textarea>
      <div style="display:flex;gap:0.75rem;align-items:center;margin-top:1rem;">
        <button class="btn" id="btnStart" onclick="startClarify()">Start →</button>
        <div class="status-line" id="statusIntent"></div>
      </div>
    </div>
  </div>

  <!-- State 2: Clarifying questions -->
  <div id="stateQuestions">
    <div class="card">
      <div class="intent-display" id="intentDisplay"></div>
      <div class="section-label">Clarifying Questions</div>
      <div id="qnaList" style="display:flex;flex-direction:column;gap:1rem;"></div>
      <div style="display:flex;gap:0.75rem;align-items:center;margin-top:1.5rem;">
        <button class="btn" id="btnElaborate" onclick="elaborate()">Elaborate →</button>
        <button class="restart-link" onclick="restart()">start over</button>
        <div class="status-line" id="statusQuestions"></div>
      </div>
    </div>
  </div>

  <!-- State 3: Result -->
  <div id="stateResult">
    <div class="result-layout">

      <!-- Left: context (readonly) -->
      <div class="card result-left">
        <div class="section-label">Intent</div>
        <div class="intent-display" id="resultIntentDisplay"></div>
        <div class="section-label" style="margin-top:1rem;">Clarifications</div>
        <div class="qna-readonly" id="resultQnA"></div>
      </div>

      <!-- Right: editable output -->
      <div class="card result-right">
        <div class="section-label">Story</div>
        <textarea id="resultStory" rows="5"></textarea>

        <div class="section-label" style="margin-top:1rem;">Acceptance Criteria</div>
        <div class="ac-inputs" id="resultAC"></div>

        <div class="section-label" style="margin-top:1rem;">Non-Functional Requirements</div>
        <div class="ac-inputs" id="resultNFRs"></div>

        <div class="section-label" style="margin-top:1rem;">Risks</div>
        <div class="ac-inputs" id="resultRisks"></div>

        <div class="result-actions">
          <button class="btn" onclick="addToSprint(this)">Add to Sprint →</button>
          <button class="btn btn-copy" onclick="copyResult()">Copy</button>
          <button class="restart-link" onclick="restart()">start over</button>
          <span class="copy-confirm" id="copyConfirm">copied</span>
          <span class="copy-confirm" id="sprintConfirm"></span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const LS = 'inception-';
    let currentIntent   = '';
    let currentQuestions = [];

    function save() {
      localStorage.setItem(LS+'intent',    currentIntent);
      localStorage.setItem(LS+'questions', JSON.stringify(currentQuestions));
      const answers = currentQuestions.map((_, i) => document.getElementById('answer-'+i)?.value || '');
      localStorage.setItem(LS+'answers', JSON.stringify(answers));
      localStorage.setItem(LS+'story', document.getElementById('resultStory').value);
      const ac    = [...document.querySelectorAll('#resultAC textarea')].map(el => el.value);
      const nfrs  = [...document.querySelectorAll('#resultNFRs textarea')].map(el => el.value);
      const risks = [...document.querySelectorAll('#resultRisks textarea')].map(el => el.value);
      localStorage.setItem(LS+'ac',    JSON.stringify(ac));
      localStorage.setItem(LS+'nfrs',  JSON.stringify(nfrs));
      localStorage.setItem(LS+'risks', JSON.stringify(risks));
    }

    function setState(name) {
      document.getElementById('stateIntent').style.display    = name === 'intent'    ? 'flex' : 'none';
      document.getElementById('stateQuestions').style.display = name === 'questions' ? 'flex' : 'none';
      document.getElementById('stateResult').style.display    = name === 'result'    ? 'block' : 'none';
      localStorage.setItem(LS+'state', name);
    }

    function setStatus(id, msg, type) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'status-line' + (type ? ' ' + type : '');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function buildQnA(questions, answers) {
      const list = document.getElementById('qnaList');
      list.innerHTML = '';
      questions.forEach((q, i) => {
        list.innerHTML += `
          <div class="qna-item">
            <div class="question-text">${escHtml(q)}</div>
            <input type="text" id="answer-${i}" placeholder="Your answer..." value="${escHtml(answers?.[i] || '')}" oninput="save()" />
          </div>`;
      });
    }

    function makeRows(items, prefix) {
      const list = items.length ? items : [''];
      return list.map(a => `
        <div class="ac-input-row">
          <span class="ac-check">${prefix}</span>
          <textarea rows="1" oninput="save()">${escHtml(a)}</textarea>
        </div>`).join('');
    }

    function buildResult(questions, answers, story, ac, nfrs, risks) {
      document.getElementById('resultIntentDisplay').textContent = currentIntent;
      document.getElementById('resultStory').value = story;

      const qnaEl = document.getElementById('resultQnA');
      qnaEl.innerHTML = questions.map((q, i) => `
        <div class="qna-readonly-item">
          <div class="qna-q">Q${i+1}</div>
          <div style="color:#888;font-size:0.8rem;margin-bottom:0.2rem;">${escHtml(q)}</div>
          <div class="qna-a">${escHtml(answers?.[i] || '—')}</div>
        </div>`).join('');

      document.getElementById('resultAC').innerHTML    = makeRows(ac,    '✓');
      document.getElementById('resultNFRs').innerHTML  = makeRows(nfrs,  '◈');
      document.getElementById('resultRisks').innerHTML = makeRows(risks, '⚑');
    }

    async function startClarify() {
      const intent = document.getElementById('intentInput').value.trim();
      if (!intent) return;
      currentIntent = intent;
      save();

      const btn = document.getElementById('btnStart');
      btn.disabled = true;
      setStatus('statusIntent', 'Generating questions...', 'active');

      try {
        const res = await fetch('/inception/clarify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ intent }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        currentQuestions = data.questions || [];
        buildQnA(currentQuestions, []);
        document.getElementById('intentDisplay').textContent = intent;
        setState('questions');
        save();
      } catch (e) {
        setStatus('statusIntent', 'Error: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        setStatus('statusIntent', '', '');
      }
    }

    async function elaborate() {
      const answers = currentQuestions.map((_, i) => (document.getElementById('answer-'+i)?.value || '').trim());
      const qna = currentQuestions.map((q, i) => ({ q, a: answers[i] }));

      const btn = document.getElementById('btnElaborate');
      btn.disabled = true;
      setStatus('statusQuestions', 'Elaborating...', 'active');

      try {
        const res = await fetch('/inception/elaborate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ intent: currentIntent, qna }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const ac    = data.acceptance_criteria || [];
        const nfrs  = data.nfrs  || [];
        const risks = data.risks || [];
        buildResult(currentQuestions, answers, data.story || '', ac, nfrs, risks);
        setState('result');
        save();
      } catch (e) {
        setStatus('statusQuestions', 'Error: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        setStatus('statusQuestions', '', '');
      }
    }

    async function addToSprint(btn) {
      const story = document.getElementById('resultStory').value.trim();
      const ac    = [...document.querySelectorAll('#resultAC textarea')].map(el => el.value.trim()).filter(Boolean);
      if (!story) return;

      btn.disabled = true;
      btn.textContent = 'Adding...';
      try {
        const res = await fetch('/inception/add-to-sprint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ intent: currentIntent, story, acceptance_criteria: ac }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const el = document.getElementById('sprintConfirm');
        el.textContent = 'added to sprint ✓';
        el.style.display = 'inline';
        btn.textContent = 'Add to Sprint →';
        btn.disabled = false;
        setTimeout(() => { el.style.display = 'none'; }, 3000);
      } catch (e) {
        btn.textContent = 'Error — retry';
        btn.disabled = false;
      }
    }

    function copyResult() {
      const story = document.getElementById('resultStory').value;
      const ac    = [...document.querySelectorAll('#resultAC textarea')].map(el => '- ' + el.value).join('\n');
      const nfrs  = [...document.querySelectorAll('#resultNFRs textarea')].map(el => '- ' + el.value).join('\n');
      const risks = [...document.querySelectorAll('#resultRisks textarea')].map(el => '- ' + el.value).join('\n');
      navigator.clipboard.writeText(`${story}\n\nAcceptance Criteria:\n${ac}\n\nNon-Functional Requirements:\n${nfrs}\n\nRisks:\n${risks}`);
      const el = document.getElementById('copyConfirm');
      el.style.display = 'inline';
      setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function clearData() {
      const intent = localStorage.getItem(LS+'intent') || 'Add a leaderboard section to the Hello Scrum app showing sprint performance stats';
      currentIntent = '';
      currentQuestions = [];
      ['questions','answers','story','ac','state'].forEach(k => localStorage.removeItem(LS+k));
      localStorage.setItem(LS+'intent', intent);
      document.getElementById('intentInput').value = intent;
      document.getElementById('qnaList').innerHTML = '';
      document.getElementById('resultStory').value = '';
      document.getElementById('resultAC').innerHTML    = '';
      document.getElementById('resultNFRs').innerHTML  = '';
      document.getElementById('resultRisks').innerHTML = '';
      setState('intent');
    }

    function restart() { clearData(); }

    // Restore from localStorage on load
    (function init() {
      const intent    = localStorage.getItem(LS+'intent') || 'Add a leaderboard section to the Hello Scrum app showing sprint performance stats';
      const state     = localStorage.getItem(LS+'state') || 'intent';
      const questions = JSON.parse(localStorage.getItem(LS+'questions') || '[]');
      const answers   = JSON.parse(localStorage.getItem(LS+'answers')   || '[]');
      const story     = localStorage.getItem(LS+'story') || '';
      const ac        = JSON.parse(localStorage.getItem(LS+'ac')        || '[]');
      const nfrs      = JSON.parse(localStorage.getItem(LS+'nfrs')     || '[]');
      const risks     = JSON.parse(localStorage.getItem(LS+'risks')    || '[]');

      currentIntent    = intent;
      currentQuestions = questions;

      document.getElementById('intentInput').value = intent;

      if (state === 'questions' && questions.length) {
        buildQnA(questions, answers);
        document.getElementById('intentDisplay').textContent = intent;
        setState('questions');
      } else if (state === 'result' && story) {
        buildResult(questions, answers, story, ac, nfrs, risks);
        setState('result');
      } else {
        setState('intent');
      }
    })();

    document.getElementById('intentInput').addEventListener('input', () => {
      localStorage.setItem(LS+'intent', document.getElementById('intentInput').value);
    });

    document.getElementById('resultStory').addEventListener('input', save);
  </script>
  <button class="btn-clear" onclick="clearData()">Clear</button>
  <script src="shared.js"></script>
</body>
</html>
