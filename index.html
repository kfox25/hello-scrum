<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4.5rem 2rem 2rem;
      margin: 0;
      min-height: 100vh;
      background: #0f1117;
      color: #e8eaf0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0 2rem;
    }
    h1 {
      font-family: monospace;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      text-transform: uppercase;
      color: #00ff99;
    }
    .tagline {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7a8099;
      margin-bottom: 0;
    }
    .version {
      font-size: 0.85rem;
      color: #00ff99;
      background: #0b1f14;
      border: 1px solid #00ff9966;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      margin-bottom: 0.4rem;
    }
    .meta { font-size: 0.8rem; color: #555; margin: 0.15rem 0; }
    .changelog { margin-top: 1.5rem; width: 100%; max-width: 500px; }
    .changelog h2 { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 0.15em; margin: 0 0 0.5rem 0; }
    .changelog-entry { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-top: 1px solid #1c1c1c; flex-wrap: wrap; }
    .changelog-entry:first-of-type { border-top: none; }
    .changelog-entry .cv { color: #00ff99; font-size: 0.78rem; font-weight: 600; }
    .changelog-entry .cd { color: #444; font-size: 0.73rem; }
    .changelog-entry .ct { color: #aaa; font-size: 0.83rem; flex: 1; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="intake.html">Intake</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="prompts.html">Prompts</a>
    <a href="notes.html">Notes</a>
    <a href="health.html">Health</a>
  </nav>
  <div class="hero">
    <h1>Hello Scrum</h1>
    <div class="tagline">ship fast · break things · own it</div>
  </div>
  <div class="version" id="version-badge">v0.1.222</div>
  <div class="meta">Last deployed: 2026-05-31 11:09:44 CT</div>
  <div id="sprint-leaderboard" style="width:100%;max-width:600px;margin-top:2rem;">
    <h2 style="font-size:0.75rem;color:#555;text-transform:uppercase;letter-spacing:0.15em;margin:0 0 0.75rem 0;">Sprint Leaderboard</h2>
    <div id="leaderboard-content" style="color:#7a8099;font-size:0.9rem;">Loading…</div>
  </div>
  <div class="changelog">
    <h2>Recent Changes</h2>
    <div id="changelog-entries"></div>
  </div>
  <script>
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function loadChangelog() {
      fetch('/version.json')
        .then(r => r.json())
        .then(data => {
          const entries = (data.changelog || []).slice().reverse().slice(0, 5);
          document.getElementById('changelog-entries').innerHTML = entries.map(e => {
            const ver = String(e.version).startsWith('v') ? e.version : 'v' + e.version;
            return `<div class="changelog-entry">
              <span class="cv">${escHtml(ver)}</span>
              <span class="cd">${escHtml(e.date || '')}</span>
              <span class="ct">${escHtml(e.change || '')}</span>
            </div>`;
          }).join('');
        })
        .catch(() => {});
    }
    loadChangelog();

    function loadLeaderboard() {
      fetch('/sdlc_pipeline.json')
        .then(r => r.json())
        .then(data => {
          const items = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
          if (!items.length) {
            document.getElementById('leaderboard-content').textContent = 'No sprint data available yet.';
            return;
          }
          const sprintMap = {};
          for (const item of items) {
            const sn = item.sprint_number;
            if (sn == null) continue;
            if (!sprintMap[sn]) sprintMap[sn] = { sprint: sn, velocity: 0, total: 0, done: 0, reviewApprove: 0, reviewTotal: 0, testPass: 0, testTotal: 0 };
            sprintMap[sn].total++;
            if (item.status === 'done') { sprintMap[sn].velocity++; sprintMap[sn].done++; }
            if (item.code_review_verdict != null && item.code_review_verdict !== '') { sprintMap[sn].reviewTotal++; if (item.code_review_verdict === 'approve') sprintMap[sn].reviewApprove++; }
            if (item.test_results != null && item.test_results !== '') { sprintMap[sn].testTotal++; const tr = String(item.test_results).toLowerCase(); if (tr.includes('pass') || tr.includes('success') || tr.includes('ok')) sprintMap[sn].testPass++; }
          }
          const sprints = Object.values(sprintMap);
          if (!sprints.length) {
            document.getElementById('leaderboard-content').textContent = 'No sprint data available yet.';
            return;
          }
          sprints.sort((a, b) => b.velocity - a.velocity || a.sprint - b.sprint);
          let html = '<table style="width:100%;border-collapse:collapse;font-size:0.88rem;">';
          html += '<thead><tr style="color:#555;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;">';
          html += '<th style="padding:0.4rem 0.6rem;text-align:center;border-bottom:1px solid #1c1c1c;">Rank</th>';
          html += '<th style="padding:0.4rem 0.6rem;text-align:center;border-bottom:1px solid #1c1c1c;">Sprint</th>';
          html += '<th style="padding:0.4rem 0.6rem;text-align:center;border-bottom:1px solid #1c1c1c;">Velocity</th>';
          html += '<th style="padding:0.4rem 0.6rem;text-align:center;border-bottom:1px solid #1c1c1c;">Completion Rate</th>';
          html += '<th style="padding:0.4rem 0.6rem;text-align:center;border-bottom:1px solid #1c1c1c;">Code Review Pass Rate</th>';
          html += '<th style="padding:0.4rem 0.6rem;text-align:center;border-bottom:1px solid #1c1c1c;">Test Pass Rate</th>';
          html += '</tr></thead><tbody>';
          sprints.forEach((s, i) => {
            const bg = i % 2 === 0 ? '#13151c' : '#0f1117';
            html += '<tr style="background:' + bg + ';">';
            html += '<td style="padding:0.4rem 0.6rem;text-align:center;color:#7a8099;">' + (i + 1) + '</td>';
            html += '<td style="padding:0.4rem 0.6rem;text-align:center;color:#e8eaf0;">Sprint ' + escHtml(String(s.sprint)) + '</td>';
            html += '<td style="padding:0.4rem 0.6rem;text-align:center;color:#00ff99;font-weight:600;">' + s.velocity + '</td>';
            const compRate = s.total === 0 ? '0%' : Math.round(s.done / s.total * 100) + '%';
            const reviewRate = s.reviewTotal === 0 ? '—' : Math.round(s.reviewApprove / s.reviewTotal * 100) + '%';
            const testRate = s.testTotal === 0 ? '—' : Math.round(s.testPass / s.testTotal * 100) + '%';
            html += '<td style="padding:0.4rem 0.6rem;text-align:center;color:#e8eaf0;">' + compRate + '</td>';
            html += '<td style="padding:0.4rem 0.6rem;text-align:center;color:#e8eaf0;">' + reviewRate + '</td>';
            html += '<td style="padding:0.4rem 0.6rem;text-align:center;color:#e8eaf0;">' + testRate + '</td>';
            html += '</tr>';
          });
          html += '</tbody></table>';
          document.getElementById('leaderboard-content').innerHTML = html;
        })
        .catch(() => {
          document.getElementById('leaderboard-content').textContent = 'No sprint data available yet.';
        });
    }
    loadLeaderboard();
  </script>
<script src="shared.js"></script>
</body>
</html>
