<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <style>
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3rem;
      color: #00ff99;
      margin-bottom: 0.25rem;
    }
    .tagline {
      font-size: 1.1rem;
      color: #aaa;
      font-style: italic;
      margin-bottom: 0.75rem;
    }
    .meta {
      font-size: 1rem;
      color: #888;
      margin: 0.25rem 0;
    }
    .audit-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      background: #1a1a1a;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      text-decoration: none;
    }
    .audit-btn:hover {
      background: #0d3320;
      border-color: #00ff99;
    }
    .version {
      font-size: 1.5rem;
      color: #fff;
      margin-top: 1rem;
      background: #1a1a1a;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .features-counter {
      margin-top: 1rem;
      background: #1a1a1a;
      border: 1px solid #00ff9940;
      border-radius: 6px;
      padding: 0.5rem 1.5rem;
      text-align: center;
    }
    .features-counter .count {
      font-size: 2rem;
      color: #00ff99;
      font-weight: bold;
    }
    .features-counter .label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <a class="audit-btn" href="audit.html">Audit</a>
  <h1>Hello Scrum</h1>
  <div class="tagline">Iterate. Improve. Deliver.</div>
  <div class="version">v0.1.2</div>
  <div class="features-counter">
    <div class="count">3</div>
    <div class="label">Features Deployed</div>
  </div>
  <div class="meta">Last deployed: 2026-05-22 15:01:57 CT</div>
  <div class="meta">Status: baseline</div>
</body>
</html>
