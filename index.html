<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <style>
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }
    @keyframes neon-sweep {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glow-pulse {
      0%, 100% { filter: drop-shadow(0 0 6px #00ff99aa) drop-shadow(0 0 18px #00ccff55); }
      50%       { filter: drop-shadow(0 0 14px #00ff99ff) drop-shadow(0 0 36px #cc00ffaa); }
    }
    h1 {
      font-family: monospace;
      font-size: 3.6rem;
      margin-bottom: 0.15rem;
      letter-spacing: 0.12em;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(120deg, #00ff99, #00ccff, #cc00ff, #ff0099, #00ff99);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: neon-sweep 4s ease infinite, glow-pulse 3s ease-in-out infinite;
    }
    .tagline {
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4a4a4a;
      margin-bottom: 0.4rem;
    }
    .title-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .meta { font-size: 0.9rem; color: #888; margin: 0.2rem 0; }
    .version {
      font-size: 0.85rem;
      color: #00ff99;
      background: #0b1f14;
      border: 1px solid #00ff9933;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      margin-bottom: 0.5rem;
    }
    .changelog { margin-top: 1.5rem; width: 100%; max-width: 480px; }
    .changelog h2 { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 0.5rem 0; }
    .changelog-entry { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-top: 1px solid #1c1c1c; flex-wrap: wrap; }
    .changelog-entry:first-of-type { border-top: none; }
    .changelog-entry .cv { color: #00ff99; font-size: 0.78rem; font-weight: 600; }
    .changelog-entry .cd { color: #444; font-size: 0.73rem; }
    .changelog-entry .ct { color: #aaa; font-size: 0.83rem; flex: 1; }
    .top-nav {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    .top-nav a {
      font-family: monospace;
      font-size: 0.85rem;
      background: #1a1a1a;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      text-decoration: none;
    }
    .top-nav a:hover { background: #0d3320; border-color: #00ff99; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/">Board</a>
    <a href="active.html">Active</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
  </nav>
  <div class="title-wrap">
    <h1>Hello Scrum</h1>
    <div class="tagline">ship fast · break things · own it</div>
  </div>
  <div class="version" id="version-badge">v0.1.20</div>
  <div class="meta">Last deployed: 2026-05-23 01:46:24 CT</div>
  <div class="meta">Status: baseline</div>
  <div class="changelog">
    <h2>Recent Changes</h2>
    <div id="changelog-entries"></div>
  </div>
  <script>
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function loadChangelog() {
      fetch('/version.json')
        .then(r => r.json())
        .then(data => {
          const entries = (data.changelog || []).slice().reverse();
          document.getElementById('changelog-entries').innerHTML = entries.map(e => {
            const ver = String(e.version).startsWith('v') ? e.version : 'v' + e.version;
            return `<div class="changelog-entry">
      <span class="cv">${escHtml(ver)}</span>
      <span class="cd">${escHtml(e.date || '')}</span>
      <span class="ct">${escHtml(e.change || '')}</span>
    </div>`;
          }).join('');
        })
        .catch(() => {});
    }
    loadChangelog();
  </script>
</body>
</html>
