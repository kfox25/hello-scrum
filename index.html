<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <style>
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }
    @keyframes flicker {
      0%, 100% { text-shadow: 0 0 8px #00ff99, 0 0 20px #00ff99, 0 0 40px #00ff9966; opacity: 1; }
      45% { text-shadow: 0 0 6px #00ff99, 0 0 14px #00ff99aa; opacity: 0.95; }
      50% { text-shadow: 0 0 12px #00ff99, 0 0 30px #00ff99, 0 0 60px #00ff9944; opacity: 1; }
      85% { text-shadow: 0 0 4px #00ff9988, 0 0 10px #00ff9966; opacity: 0.92; }
    }
    @keyframes pulse-scale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes glow-bar {
      0%, 100% { opacity: 0.7; width: 40%; }
      50% { opacity: 1; width: 80%; }
    }
    @keyframes neon-sweep {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.08em;
      font-weight: 600;
      background: linear-gradient(90deg, #00ff99, #00cfff, #a78bfa, #00ff99);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 4px #00ff9966);
      animation: neon-sweep 10s ease infinite;
    }
    .title-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .title-glow-bar {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, #00ff99, #00cfff, #a78bfa, #ff6edf);
      animation: glow-bar 3s ease-in-out infinite;
      filter: blur(1px) drop-shadow(0 0 6px #00ff99);
      margin-top: -0.3rem;
    }
    .meta { font-size: 0.9rem; color: #888; margin: 0.2rem 0; }
    .version {
      font-size: 0.85rem;
      color: #00ff99;
      background: #0b1f14;
      border: 1px solid #00ff9933;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      margin-bottom: 0.5rem;
    }
    .changelog { margin-top: 1.5rem; width: 100%; max-width: 480px; }
    .changelog h2 { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 0.5rem 0; }
    .changelog-entry { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-top: 1px solid #1c1c1c; flex-wrap: wrap; }
    .changelog-entry:first-of-type { border-top: none; }
    .changelog-entry .cv { color: #00ff99; font-size: 0.78rem; font-weight: 600; }
    .changelog-entry .cd { color: #444; font-size: 0.73rem; }
    .changelog-entry .ct { color: #aaa; font-size: 0.83rem; flex: 1; }
  </style>
</head>
<body>
  <div class="title-wrap">
    <h1>Hello Scrum</h1>
    <div class="title-glow-bar"></div>
  </div>
  <div class="version" id="version-badge">v0.1.4</div>
  <div class="meta">Last deployed: 2026-05-22 23:19:33 CT</div>
  <div class="meta">Status: baseline</div>
  <div class="changelog">
    <h2>Recent Changes</h2>
    <div id="changelog-entries"></div>
  </div>
  <script>
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function loadChangelog() {
      fetch('/version.json')
        .then(r => r.json())
        .then(data => {
          const entries = (data.changelog || []).slice().reverse();
          document.getElementById('changelog-entries').innerHTML = entries.map(e => {
            const ver = String(e.version).startsWith('v') ? e.version : 'v' + e.version;
            return `<div class="changelog-entry">
      <span class="cv">${escHtml(ver)}</span>
      <span class="cd">${escHtml(e.date || '')}</span>
      <span class="ct">${escHtml(e.change || '')}</span>
    </div>`;
          }).join('');
        })
        .catch(() => {});
    }
    loadChangelog();
  </script>
</body>
</html>
