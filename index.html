<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4.5rem 2rem 2rem;
      margin: 0;
      min-height: 100vh;
      background: #0f1117;
      color: #e8eaf0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0 2rem;
    }
    h1 {
      font-family: monospace;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      text-transform: uppercase;
      color: #00ff99;
    }
    .tagline {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7a8099;
      margin-bottom: 0;
    }
    .version {
      font-size: 0.85rem;
      color: #00ff99;
      background: #0b1f14;
      border: 1px solid #00ff9966;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      margin-bottom: 0.4rem;
    }
    .meta { font-size: 0.8rem; color: #555; margin: 0.15rem 0; }
    .changelog { margin-top: 1.5rem; width: 100%; max-width: 500px; }
    .changelog h2 { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 0.15em; margin: 0 0 0.5rem 0; }
    .changelog-entry { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-top: 1px solid #1c1c1c; flex-wrap: wrap; }
    .changelog-entry:first-of-type { border-top: none; }
    .changelog-entry .cv { color: #00ff99; font-size: 0.78rem; font-weight: 600; }
    .changelog-entry .cd { color: #444; font-size: 0.73rem; }
    .changelog-entry .ct { color: #aaa; font-size: 0.83rem; flex: 1; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="intake.html">Intake</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="prompts.html">Prompts</a>
    <a href="notes.html">Notes</a>
    <a href="health.html">Health</a>
  </nav>
  <div class="hero">
    <h1>Hello Scrum</h1>
    <div class="tagline">ship fast · break things · own it</div>
  </div>
  <div class="version" id="version-badge">v0.1.211</div>
  <div class="meta">Last deployed: 2026-05-30 19:24:49 CT</div>
  <div id="leaderboard-section" style="width:100%;max-width:600px;margin-bottom:2rem;">
    <h2 style="font-size:0.75rem;color:#555;text-transform:uppercase;letter-spacing:0.15em;margin:0 0 0.75rem 0;">Sprint Leaderboard</h2>
    <table id="leaderboard-table" style="width:100%;border-collapse:collapse;font-size:0.88rem;">
      <thead>
        <tr style="border-bottom:1px solid #2a2a2a;">
          <th style="text-align:left;padding:0.4rem 0.6rem;color:#7a8099;font-weight:600;">Sprint</th>
          <th style="text-align:right;padding:0.4rem 0.6rem;color:#7a8099;font-weight:600;">Done</th>
          <th style="text-align:right;padding:0.4rem 0.6rem;color:#7a8099;font-weight:600;">Failed</th>
          <th style="text-align:right;padding:0.4rem 0.6rem;color:#7a8099;font-weight:600;">Pass Rate</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4" style="padding:0.6rem;color:#444;">No sprint data found.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="changelog">
    <h2>Recent Changes</h2>
    <div id="changelog-entries"></div>
  </div>
  <script>
    function buildLeaderboard() {
      try {
        const raw = localStorage.getItem('scrumItems') || localStorage.getItem('backlogItems') || '[]';
        const items = JSON.parse(raw);
        if (!Array.isArray(items) || items.length === 0) return;
        const sprintMap = {};
        items.forEach(item => {
          const sprint = item.sprint || item.sprintId || item.Sprint || null;
          if (!sprint) return;
          const key = String(sprint);
          if (!sprintMap[key]) sprintMap[key] = { done: 0, failed: 0 };
          const status = String(item.status || item.Status || '').toLowerCase();
          if (status === 'done' || status === 'complete' || status === 'completed') sprintMap[key].done++;
          else if (status === 'failed' || status === 'fail' || status === 'blocked') sprintMap[key].failed++;
        });
        const sprints = Object.keys(sprintMap).sort();
        if (sprints.length === 0) return;
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = sprints.map(sprint => {
          const { done, failed } = sprintMap[sprint];
          const total = done + failed;
          let passRate;
          if (total === 0) {
            passRate = '&mdash;';
          } else if (failed === 0) {
            passRate = '100%';
          } else if (done === 0) {
            passRate = '0%';
          } else {
            passRate = Math.round((done / total) * 100) + '%';
          }
          return `<tr style="border-bottom:1px solid #1c1c1c;">
            <td style="padding:0.4rem 0.6rem;color:#e8eaf0;text-align:left;">${escHtml(sprint)}</td>
            <td style="padding:0.4rem 0.6rem;color:#00ff99;text-align:right;">${done}</td>
            <td style="padding:0.4rem 0.6rem;color:#ff4466;text-align:right;">${failed}</td>
            <td style="padding:0.4rem 0.6rem;color:#e8eaf0;text-align:right;font-weight:600;">${passRate}</td>
          </tr>`;
        }).join('');
      } catch(e) {}
    }
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function loadChangelog() {
      fetch('/version.json')
        .then(r => r.json())
        .then(data => {
          const entries = (data.changelog || []).slice().reverse().slice(0, 5);
          document.getElementById('changelog-entries').innerHTML = entries.map(e => {
            const ver = String(e.version).startsWith('v') ? e.version : 'v' + e.version;
            return `<div class="changelog-entry">
              <span class="cv">${escHtml(ver)}</span>
              <span class="cd">${escHtml(e.date || '')}</span>
              <span class="ct">${escHtml(e.change || '')}</span>
            </div>`;
          }).join('');
        })
        .catch(() => {});
    }
    loadChangelog();
    buildLeaderboard();
  </script>
<script src="shared.js"></script>
</body>
</html>
