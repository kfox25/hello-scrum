<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4.5rem 2rem 2rem;
      margin: 0;
      min-height: 100vh;
      background: #0f1117;
      color: #e8eaf0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0 2rem;
    }
    h1 {
      font-family: monospace;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      text-transform: uppercase;
      color: #00ff99;
    }
    .tagline {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7a8099;
      margin-bottom: 0;
    }
    .version {
      font-size: 0.85rem;
      color: #00ff99;
      background: #0b1f14;
      border: 1px solid #00ff9966;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      margin-bottom: 0.4rem;
    }
    .meta { font-size: 0.8rem; color: #555; margin: 0.15rem 0; }
    .changelog { margin-top: 1.5rem; width: 100%; max-width: 500px; }
    .changelog h2 { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 0.15em; margin: 0 0 0.5rem 0; }
    .changelog-entry { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-top: 1px solid #1c1c1c; flex-wrap: wrap; }
    .changelog-entry:first-of-type { border-top: none; }
    .changelog-entry .cv { color: #00ff99; font-size: 0.78rem; font-weight: 600; }
    .changelog-entry .cd { color: #444; font-size: 0.73rem; }
    .changelog-entry .ct { color: #aaa; font-size: 0.83rem; flex: 1; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="intake.html">Intake</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="prompts.html">Prompts</a>
    <a href="notes.html">Notes</a>
    <a href="health.html">Health</a>
  </nav>
  <div class="hero">
    <h1>Hello Scrum</h1>
    <div class="tagline">ship fast · break things · own it</div>
  </div>
  <div class="version" id="version-badge">v0.1.215</div>
  <div class="meta">Last deployed: 2026-05-30 22:02:06 CT</div>
  <div class="changelog">
    <h2>Recent Changes</h2>
    <div id="changelog-entries"></div>
  </div>
  <section id="sprint-leaderboard" style="width:100%;max-width:560px;margin:2rem auto 0;">
    <h2 style="font-size:0.75rem;color:#555;text-transform:uppercase;letter-spacing:0.15em;margin:0 0 0.75rem 0;">Sprint Leaderboard — Stories Completed</h2>
    <div id="leaderboard-body" style="width:100%;"></div>
  </section>
  <script>
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function loadChangelog() {
      fetch('/version.json')
        .then(r => r.json())
        .then(data => {
          const entries = (data.changelog || []).slice().reverse().slice(0, 5);
          document.getElementById('changelog-entries').innerHTML = entries.map(e => {
            const ver = String(e.version).startsWith('v') ? e.version : 'v' + e.version;
            return `<div class="changelog-entry">
              <span class="cv">${escHtml(ver)}</span>
              <span class="cd">${escHtml(e.date || '')}</span>
              <span class="ct">${escHtml(e.change || '')}</span>
            </div>`;
          }).join('');
        })
        .catch(() => {});
    }
    loadChangelog();

    function loadLeaderboard() {
      fetch('/sdlc_pipeline.json')
        .then(r => r.json())
        .then(data => {
          const items = data.items || [];
          const sprintMap = {};
          const sprintMapFull = {};
          items.forEach(item => {
            const sn2 = item.sprint_number;
            if (sn2 === undefined || sn2 === null) return;
            if (!sprintMapFull[sn2]) sprintMapFull[sn2] = { done: 0, failed: 0 };
            const st2 = (item.status || '').toLowerCase();
            if (st2 === 'done') sprintMapFull[sn2].done++;
            else if (st2 === 'failed') sprintMapFull[sn2].failed++;
          });
          items.forEach(item => {
            const sn = item.sprint_number;
            if (sn === undefined || sn === null) return;
            const st = (item.status || '').toLowerCase();
            if (st !== 'done' && st !== 'failed') return;
            if (!sprintMap[sn]) sprintMap[sn] = { sprint: sn, completed: 0 };
            if (st === 'done') sprintMap[sn].completed++;
          });
          const rows = Object.values(sprintMap);
          rows.sort((a, b) => b.completed - a.completed || a.sprint - b.sprint);
          const container = document.getElementById('leaderboard-body');
          if (rows.length === 0) {
            container.innerHTML = '<p style="color:#555;font-size:0.85rem;">No sprint data available.</p>';
            return;
          }
          const medals = ['🥇','🥈','🥉'];
          container.innerHTML = rows.map((r, i) => {
            const rank = i + 1;
            const medal = medals[i] || '';
            const fd = sprintMapFull[r.sprint] || { done: 0, failed: 0 };
            const total = fd.done + fd.failed;
            const passRate = total === 0 ? '—' : (fd.done === total ? '100%' : (fd.failed === total ? '0%' : Math.round((fd.done / total) * 100) + '%'));
            return `<div style="display:flex;align-items:center;gap:0.75rem;padding:0.45rem 0.6rem;border-top:1px solid #1c1c1c;font-size:0.88rem;">
              <span style="width:2rem;text-align:center;font-size:1rem;">${medal || rank}</span>
              <span style="color:#7a8099;min-width:4.5rem;">Sprint ${escHtml(String(r.sprint))}</span>
              <span style="color:#e8eaf0;flex:1;">Rank #${rank}</span>
              <span style="color:#00ff99;font-weight:700;">${r.completed} completed</span>
              <span style="color:#7a8099;font-size:0.8rem;min-width:4.5rem;text-align:right;">Pass: ${passRate}</span>
            </div>`;
          }).join('');
        })
        .catch(() => {
          const container = document.getElementById('leaderboard-body');
          if (container) container.innerHTML = '<p style="color:#555;font-size:0.85rem;">Could not load sprint data.</p>';
        });
    }
    loadLeaderboard();
  </script>
<script src="shared.js"></script>
</body>
</html>
