<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4.5rem 2rem 2rem;
      margin: 0;
      min-height: 100vh;
      background: #0f1117;
      color: #e8eaf0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0 2rem;
    }
    h1 {
      font-family: monospace;
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 0.5rem;
      text-transform: uppercase;
      color: #00ff99;
    }
    .tagline {
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7a8099;
      margin-bottom: 0;
    }
    .version {
      font-size: 0.85rem;
      color: #00ff99;
      background: #0b1f14;
      border: 1px solid #00ff9966;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      margin-bottom: 0.4rem;
    }
    .meta { font-size: 0.8rem; color: #555; margin: 0.15rem 0; }
    .changelog { margin-top: 1.5rem; width: 100%; max-width: 480px; }
    .changelog h2 { font-size: 0.75rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 0.5rem 0; }
    .changelog-entry { display: flex; gap: 0.75rem; padding: 0.4rem 0; border-top: 1px solid #1c1c1c; flex-wrap: wrap; }
    .changelog-entry:first-of-type { border-top: none; }
    .changelog-entry .cv { color: #00ff99; font-size: 0.78rem; font-weight: 600; }
    .changelog-entry .cd { color: #444; font-size: 0.73rem; }
    .changelog-entry .ct { color: #aaa; font-size: 0.83rem; flex: 1; }
    .section-divider {
      width: 100%;
      max-width: 480px;
      border: none;
      border-top: 1px solid #1c1c1c;
      margin: 1.5rem 0;
    }
    .health-monitor {
      margin-top: 2rem;
      width: 100%;
      max-width: 480px;
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .health-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .health-title { font-size: 0.7rem; color: #444; text-transform: uppercase; letter-spacing: 0.1em; }
    .health-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #333;
      transition: background 0.3s;
    }
    .health-dot.healthy  { background: #00ff99; box-shadow: 0 0 6px #00ff9966; }
    .health-dot.warning  { background: #ffcc00; box-shadow: 0 0 6px #ffcc0066; }
    .health-dot.critical { background: #ff4444; box-shadow: 0 0 6px #ff444466; }
    .health-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .health-file { font-size: 0.8rem; color: #555; font-family: monospace; }
    .health-size { font-size: 1rem; font-family: monospace; color: #ccc; }
    .health-tokens { font-size: 0.78rem; color: #444; }
    .health-lines { font-size: 0.78rem; color: #444; font-family: monospace; }
    .health-bar-wrap {
      margin-top: 0.5rem;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }
    .health-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s, background 0.3s;
      background: #333;
    }
    .health-bar.healthy  { background: #00ff99; }
    .health-bar.warning  { background: #ffcc00; }
    .health-bar.critical { background: #ff4444; }
    .health-label {
      margin-top: 0.35rem;
      font-size: 0.7rem;
      color: #333;
    }
    .health-label.healthy  { color: #00ff9966; }
    .health-label.warning  { color: #ffcc0080; }
    .health-label.critical { color: #ff444499; }
    #resetBtn {
      font-family: monospace;
      color: #00ff99;
      background: #1a1a1a;
      border: 1px solid #00ff9940;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: block;
      width: 100%;
    }
    #resetBtn:hover { background: #0b1f14; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="messenger.html">Messenger</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="notes.html">Notes</a>
    <a href="health.html">Health</a>
  </nav>
  <div class="hero">
    <h1>Hello Scrum</h1>
    <div class="tagline">ship fast · break things · own it</div>
  </div>
  <div class="version" id="version-badge">v0.1.61</div>
  <div class="meta">Last deployed: 2026-05-25 21:10:10 CT</div>
  <div class="meta" id="last-updated">Last updated: —</div>
  <div class="changelog">
    <h2>Recent Changes</h2>
    <div id="changelog-entries"></div>
  </div>

  <hr class="section-divider">
  <div class="health-monitor">
    <div class="health-header">
      <span class="health-title">index.html health</span>
      <span class="health-dot" id="hDot"></span>
    </div>
    <div class="health-row">
      <span class="health-file">index.html</span>
      <span class="health-size" id="hSize">—</span>
      <span class="health-tokens" id="hTokens"></span>
      <span class="health-lines" id="hLines">—</span>
    </div>
    <div class="health-bar-wrap"><div class="health-bar" id="hBar"></div></div>
    <div class="health-label" id="hLabel">loading…</div>
    <button id="resetBtn">Reset</button>
  </div>
  <script>
    function loadLastUpdated() {
      fetch('/version.json')
        .then(r => r.json())
        .then(data => {
          const deployed = data.deployed && String(data.deployed).trim();
          document.getElementById('last-updated').textContent =
            deployed ? 'Last updated: ' + deployed : 'Last updated: —';
        })
        .catch(() => {
          document.getElementById('last-updated').textContent = 'Last updated: —';
        });
    }
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function loadChangelog() {
      fetch('/version.json')
        .then(r => r.json())
        .then(data => {
          const entries = (data.changelog || []).slice().reverse().slice(0, 5);
          document.getElementById('changelog-entries').innerHTML = entries.map(e => {
            const ver = String(e.version).startsWith('v') ? e.version : 'v' + e.version;
            return `<div class="changelog-entry">
              <span class="cv">${escHtml(ver)}</span>
              <span class="cd">${escHtml(e.date || '')}</span>
              <span class="ct">${escHtml(e.change || '')}</span>
            </div>`;
          }).join('');
        })
        .catch(() => {});
    }
    loadChangelog();
    loadLastUpdated();

    function loadHealth() {
      fetch('/health')
        .then(r => r.json())
        .then(d => {
          const MAX_KB = 24;
          const pct = Math.min(100, (d.kb / MAX_KB) * 100);
          const labels = {
            healthy:  'healthy — well within budget',
            warning:  'watch it — getting large',
            critical: 'bloated — refactor before next sprint',
          };
          document.getElementById('hDot').className   = `health-dot ${d.status}`;
          document.getElementById('hSize').textContent = `${d.kb} KB`;
          document.getElementById('hTokens').textContent = `~${d.tokens_est.toLocaleString()} tokens`;
          document.getElementById('hLines').textContent = d.lines != null ? `~${Number(d.lines).toLocaleString()} lines` : '—';
          const bar = document.getElementById('hBar');
          bar.style.width = pct + '%';
          bar.className = `health-bar ${d.status}`;
          const lbl = document.getElementById('hLabel');
          lbl.textContent = labels[d.status] || d.status;
          lbl.className = `health-label ${d.status}`;
        })
        .catch(() => {
          document.getElementById('hLabel').textContent = 'health check unavailable (server offline)';
        });
    }
    loadHealth();

    document.getElementById('resetBtn').addEventListener('click', function() {
      document.getElementById('changelog-entries').innerHTML = '';
      const dot = document.getElementById('hDot');
      dot.className = 'health-dot';
      const bar = document.getElementById('hBar');
      bar.className = 'health-bar';
      bar.style.width = '0%';
      const lbl = document.getElementById('hLabel');
      lbl.className = 'health-label';
      lbl.textContent = 'loading…';
      document.getElementById('hSize').textContent = '—';
      document.getElementById('hTokens').textContent = '';
      document.getElementById('hLines').textContent = '—';
      loadChangelog();
      loadLastUpdated();
      loadHealth();
    });
  </script>
</body>
</html>
