<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Scrum</title>
  <style>
    body {
      font-family: monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3rem;
      color: #00ff99;
      margin-bottom: 0.5rem;
    }
    .meta {
      font-size: 1rem;
      color: #888;
      margin: 0.25rem 0;
    }
    .version {
      font-size: 1.5rem;
      color: #fff;
      margin-top: 1rem;
      background: #1a1a1a;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>Hello Scrum</h1>
  <div class="version">v0.1.0</div>
  <div class="meta">Last deployed: 2026-05-22 14:15:49 CT</div>
  <div class="meta">Status: baseline</div>
  <div class="meta" id="clock"></div>
  <script>
    function updateClock() {
      const now = new Date();
      const ct = now.toLocaleString("en-US", {
        timeZone: "America/Chicago",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: true
      });
      document.getElementById("clock").textContent = ct + " CT";
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
