<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      margin-top: 3.5rem;
    }

    /* ── shared panel structure ── */
    .left-panel, .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .panel-divider { width: 1px; background: #222; flex-shrink: 0; }
    .panel-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    .panel-header h2 { color: #00ff99; font-size: 1.1rem; margin: 0 0 0.15rem; font-weight: 600; }
    .panel-header .subtitle { color: #555; font-size: 0.78rem; }

    /* ── left: chat ── */
    .chat-header {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.85rem;
      color: #666;
      flex-shrink: 0;
    }
    .chat-header span { color: #00ff99; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message { display: flex; gap: 0.75rem; align-items: flex-start; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: #1a3a2a; border: 1px solid #00ff9930;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; color: #00ff99; flex-shrink: 0;
    }
    .avatar.bot { background: #0a1f12; }
    .msg-body { flex: 1; }
    .msg-meta { display: flex; gap: 0.6rem; align-items: baseline; margin-bottom: 0.2rem; }
    .msg-author { font-size: 0.8rem; color: #00ff99; }
    .msg-time { font-size: 0.7rem; color: #444; }
    .msg-text { font-size: 0.85rem; color: #ccc; line-height: 1.5; }
    .system-msg { font-size: 0.75rem; color: #444; text-align: center; padding: 0.25rem 0; }

    .story-choices { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.5rem; }
    .story-choice {
      background: #0f1f0f; border: 1px solid #00ff9930; border-radius: 5px;
      padding: 0.5rem 0.75rem; font-size: 0.83rem; color: #aaa;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .story-choice:hover { background: #0d3320; border-color: #00ff99; color: #e0e0e0; }
    .story-choice.selected { background: #0d3320; border-color: #00ff99; color: #00ff99; cursor: default; }
    .story-choice.dimmed  { opacity: 0.3; cursor: default; pointer-events: none; }
    .story-choice.promote-as-is { background: #0a0f1f; border-color: #00ff9930; color: #aaa; }
    .story-choice.promote-as-is:hover { background: #0d2a1a; border-color: #00ff99; color: #e0e0e0; }

    .compose {
      border-top: 1px solid #222;
      padding: 0.75rem 1.25rem 2.5rem;
      display: flex; gap: 0.6rem; align-items: flex-end;
      flex-shrink: 0;
    }
    .compose-input {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 6px; padding: 0.6rem 0.9rem;
      font-family: monospace; font-size: 0.85rem; color: #e0e0e0;
      resize: none; outline: none; min-height: 2.4rem; max-height: 120px;
    }
    .compose-input:focus { border-color: #00ff9950; }
    .compose-input::placeholder { color: #666; }
    .send-btn {
      background: #0d3320; border: 1px solid #00ff9960; color: #00ff99;
      font-family: monospace; font-size: 0.8rem; padding: 0.3rem 0.9rem;
      border-radius: 4px; cursor: pointer; white-space: nowrap;
    }
    .send-btn:hover { background: #114428; border-color: #00ff99; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── right: meeting extract ── */
    .extract-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.25rem 2rem;
      gap: 0.75rem;
      overflow: hidden;
    }
    .transcript-input {
      flex: 0 0 auto;
      height: 38%;
      min-height: 120px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      font-family: monospace;
      font-size: 0.82rem;
      color: #e0e0e0;
      resize: none;
      outline: none;
      line-height: 1.5;
    }
    .transcript-input:focus { border-color: #00ff9950; }
    .transcript-input::placeholder { color: #555; }
    .extract-btn {
      background: #0d3320; border: 1px solid #00ff9960; color: #00ff99;
      font-family: monospace; font-size: 0.82rem; padding: 0.45rem 1.1rem;
      border-radius: 4px; cursor: pointer; align-self: flex-start; flex-shrink: 0;
    }
    .extract-btn:hover { background: #114428; border-color: #00ff99; }
    .extract-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .extract-results {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .extract-section-title {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
      margin-bottom: 0.4rem;
    }
    .extract-story {
      background: #0f1f0f; border: 1px solid #00ff9930; border-radius: 5px;
      padding: 0.5rem 0.75rem; font-size: 0.83rem; color: #aaa;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
      margin-bottom: 0.35rem;
    }
    .extract-story:hover { background: #0d3320; border-color: #00ff99; color: #e0e0e0; }
    .extract-story.added { background: #0b1f14; border-color: #00ff9940; color: #00ff99; cursor: default; }
    .update-card {
      background: #111; border: 1px solid #222; border-radius: 6px;
      padding: 0.75rem 0.9rem; display: flex; flex-direction: column; gap: 0.4rem;
    }
    .update-idea { font-size: 0.82rem; color: #ccc; font-weight: 500; }
    .update-changes { font-size: 0.75rem; color: #777; line-height: 1.4; }
    .update-ac {
      font-size: 0.74rem; color: #555; line-height: 1.5;
      border-top: 1px solid #1c1c1c; padding-top: 0.4rem; margin-top: 0.1rem;
    }
    .update-actions { display: flex; gap: 0.5rem; margin-top: 0.2rem; }
    .apply-btn {
      font-family: monospace; font-size: 0.75rem; padding: 0.25rem 0.7rem;
      border-radius: 3px; cursor: pointer;
      background: #0b1f14; border: 1px solid #00ff9940; color: #00ff99;
    }
    .apply-btn:hover { background: #0d2a1a; border-color: #00ff99; }
    .dismiss-btn {
      font-family: monospace; font-size: 0.75rem; padding: 0.25rem 0.7rem;
      border-radius: 3px; cursor: pointer;
      background: #111; border: 1px solid #222; color: #555;
    }
    .dismiss-btn:hover { color: #999; border-color: #333; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="messenger.html">Messenger</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="notes.html">Notes</a>
    <a href="health.html">Health</a>
  </nav>

  <div class="layout">
    <!-- LEFT: Teams Messenger -->
    <div class="left-panel">
      <div class="panel-header">
        <h2>Teams Messenger</h2>
        <div class="subtitle">Heard around the watercooler.</div>
      </div>
      <div class="chat-header"><span>#general</span> &mdash; team channel</div>
      <div class="messages" id="messages"></div>
      <div class="compose">
        <textarea class="compose-input" id="compose" placeholder="Message #general" rows="1"></textarea>
        <button class="send-btn" id="send-btn">Send</button>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- RIGHT: Meeting Extract -->
    <div class="right-panel">
      <div class="panel-header">
        <h2>Meeting Extract</h2>
        <div class="subtitle">Paste a transcript &mdash; find stories &amp; updates.</div>
      </div>
      <div class="extract-body">
        <textarea class="transcript-input" id="transcript" placeholder="Paste meeting notes or transcript here…"></textarea>
        <button class="extract-btn" id="extract-btn">Extract Stories</button>
        <div class="extract-results" id="extract-results"></div>
      </div>
    </div>
  </div>

  <script>
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Left panel: Teams Messenger ──────────────────────────────────────────
    const messagesEl = document.getElementById('messages');
    const composeEl  = document.getElementById('compose');
    const sendBtn    = document.getElementById('send-btn');
    const STORAGE_KEY = 'hs-msgs-general';

    function saveMessages() {
      try {
        const msgs = [...messagesEl.querySelectorAll('.message:not(#thinking-msg)')].map(el => ({
          author: el.querySelector('.msg-author').textContent,
          text:   el.querySelector('.msg-text').innerHTML,
          isBot:  el.querySelector('.avatar').classList.contains('bot'),
          time:   el.querySelector('.msg-time').textContent,
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
      } catch {}
    }

    function renderMessage(author, text, isBot, time) {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <div class="avatar${isBot ? ' bot' : ''}">${author.slice(0,2).toUpperCase()}</div>
        <div class="msg-body">
          <div class="msg-meta">
            <span class="msg-author${isBot ? ' bot' : ''}">${esc(author)}</span>
            <span class="msg-time">${esc(time)}</span>
          </div>
          <div class="msg-text">${text}</div>
        </div>`;
      messagesEl.appendChild(div);
    }

    function loadMessages() {
      messagesEl.innerHTML = '';
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        stored.forEach(m => renderMessage(m.author, m.text, m.isBot, m.time));
      } catch {}
      if (!messagesEl.children.length) {
        renderMessage('hello-scrum', 'Ready. Describe a feature idea and I\'ll suggest two versions plus the option to promote it as-is.', true, now());
      }
      setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 150);
    }

    function now() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(author, text, isBot) {
      renderMessage(author, text, isBot, now());
      messagesEl.scrollTop = messagesEl.scrollHeight;
      saveMessages();
    }

    function appendThinking() {
      const div = document.createElement('div');
      div.className = 'message';
      div.id = 'thinking-msg';
      div.innerHTML = `
        <div class="avatar bot">AI</div>
        <div class="msg-body">
          <div class="msg-meta">
            <span class="msg-author bot">hello-scrum</span>
            <span class="msg-time">${now()}</span>
          </div>
          <div class="msg-text" style="color:#444">evaluating...</div>
        </div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function send() {
      const text = composeEl.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      composeEl.value = '';
      composeEl.style.height = '';
      appendMessage('you', text, false);
      appendThinking();
      try {
        const res  = await fetch('/messenger/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        document.getElementById('thinking-msg')?.remove();
        if (data.stories && data.stories.length) {
          const suggestions = data.stories.map((s, i) =>
            `<div class="story-choice" data-story="${s.replace(/"/g, '&quot;')}">${i + 1}. ${esc(s)}</div>`
          ).join('');
          const orig = data.original || '';
          const promoteBtn = `<div class="story-choice promote-as-is" data-story="${orig.replace(/"/g, '&quot;')}">3. ${esc(orig.charAt(0).toUpperCase() + orig.slice(1))}</div>`;
          appendMessage('hello-scrum', `${data.reply || 'Pick a version:'}<div class="story-choices">${suggestions}${promoteBtn}</div>`, true);
        } else {
          appendMessage('hello-scrum', data.reply || '', true);
        }
      } catch (err) {
        document.getElementById('thinking-msg')?.remove();
        appendMessage('hello-scrum', `Error: ${esc(err.message)}`, true);
      } finally {
        sendBtn.disabled = false;
      }
    }

    messagesEl.addEventListener('click', async (e) => {
      const choice = e.target.closest('.story-choice');
      if (!choice || choice.classList.contains('selected') || choice.classList.contains('dimmed')) return;
      const container = choice.closest('.story-choices');
      if (!container) return;
      const story = choice.dataset.story;
      container.querySelectorAll('.story-choice').forEach(c => {
        c.classList.add(c === choice ? 'selected' : 'dimmed');
      });
      saveMessages();
      try {
        const res  = await fetch('/messenger/choose', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ story }),
        });
        const data = await res.json();
        appendMessage('hello-scrum', data.reply || 'Added.', true);
      } catch (err) {
        appendMessage('hello-scrum', `Error: ${esc(err.message)}`, true);
      }
    });

    loadMessages();
    sendBtn.addEventListener('click', send);
    composeEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    composeEl.addEventListener('input', () => {
      composeEl.style.height = 'auto';
      composeEl.style.height = Math.min(composeEl.scrollHeight, 120) + 'px';
    });

    // ── Right panel: Meeting Extract ─────────────────────────────────────────
    const transcriptEl = document.getElementById('transcript');
    const extractBtn   = document.getElementById('extract-btn');
    const resultsEl    = document.getElementById('extract-results');
    let pendingUpdates = {};

    async function extractStories() {
      const text = transcriptEl.value.trim();
      if (!text) return;
      extractBtn.disabled = true;
      extractBtn.textContent = 'Extracting…';
      resultsEl.innerHTML = '';
      pendingUpdates = {};

      try {
        const res  = await fetch('/messenger/meeting', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript: text }),
        });
        const data = await res.json();

        if (data.error) {
          resultsEl.innerHTML = `<div style="font-size:0.8rem;color:#ff4444">${esc(data.error)}</div>`;
          return;
        }

        const newStories = data.new_stories || [];
        const updates    = data.updates    || [];
        let html = '';

        if (newStories.length) {
          const cards = newStories.map(s =>
            `<div class="extract-story" data-story="${s.replace(/"/g,'&quot;')}">${esc(s)}</div>`
          ).join('');
          html += `<div>
            <div class="extract-section-title">${newStories.length} new stor${newStories.length === 1 ? 'y' : 'ies'} found</div>
            ${cards}
          </div>`;
        }

        if (updates.length) {
          for (const u of updates) pendingUpdates[u.id] = u;
          const cards = updates.map(u => {
            const titleChanged = u.proposed_idea && u.proposed_idea !== u.idea;
            const titleHtml = titleChanged
              ? `<div class="update-idea"><span style="color:#555;text-decoration:line-through">${esc(u.idea)}</span> → ${esc(u.proposed_idea)}</div>`
              : `<div class="update-idea">${esc(u.idea)}</div>`;
            const acLines = (u.proposed_ac || []).map(a => `<div>· ${esc(a)}</div>`).join('');
            return `<div class="update-card" data-id="${esc(u.id)}">
              ${titleHtml}
              <div class="update-changes">${esc(u.changes)}</div>
              ${acLines ? `<div class="update-ac">${acLines}</div>` : ''}
              <div class="update-actions">
                <button class="apply-btn" data-id="${esc(u.id)}">Apply</button>
                <button class="dismiss-btn">Dismiss</button>
              </div>
            </div>`;
          }).join('');
          html += `<div>
            <div class="extract-section-title">${updates.length} proposed update${updates.length === 1 ? '' : 's'}</div>
            ${cards}
          </div>`;
        }

        if (!newStories.length && !updates.length) {
          html = '<div style="font-size:0.8rem;color:#555">No new stories or updates found in this transcript.</div>';
        }

        resultsEl.innerHTML = html;

      } catch (err) {
        resultsEl.innerHTML = `<div style="font-size:0.8rem;color:#ff4444">Error: ${esc(err.message)}</div>`;
      } finally {
        extractBtn.disabled = false;
        extractBtn.textContent = 'Extract Stories';
      }
    }

    resultsEl.addEventListener('click', async (e) => {
      // New story: add to opportunity backlog
      const story = e.target.closest('.extract-story');
      if (story && !story.classList.contains('added')) {
        const title = story.dataset.story;
        story.classList.add('added');
        story.textContent = '✓ ' + title;
        try {
          await fetch('/messenger/choose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ story: title }),
          });
        } catch {}
        return;
      }

      // Apply proposed update
      const applyBtn = e.target.closest('.apply-btn');
      if (applyBtn) {
        const id     = applyBtn.dataset.id;
        const update = pendingUpdates[id];
        if (!update) return;
        const card   = applyBtn.closest('.update-card');
        try {
          await fetch('/messenger/apply-update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, proposed_idea: update.proposed_idea || '', proposed_ac: update.proposed_ac || [], changes: update.changes }),
          });
          card.innerHTML = '<div style="font-size:0.78rem;color:#00ff99">✓ Update applied</div>';
        } catch (err) {
          card.querySelector('.update-changes').textContent = 'Error: ' + err.message;
        }
        return;
      }

      // Dismiss proposed update
      const dismissBtn = e.target.closest('.dismiss-btn');
      if (dismissBtn) {
        const card = dismissBtn.closest('.update-card');
        card.style.opacity = '0.25';
        card.style.pointerEvents = 'none';
      }
    });

    extractBtn.addEventListener('click', extractStories);
  </script>
</body>
</html>
