<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Notes — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 4rem 2rem 2rem; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header { margin-bottom: 1.5rem; flex-shrink: 0; }
    h1 { color: #00ff99; font-size: 1.8rem; }
    .subtitle { color: #555; font-size: 0.85rem; margin-top: 0.25rem; }

    .notes-layout { display: flex; gap: 1.5rem; flex: 1; min-height: 0; }

    .notes-sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .btn-new {
      background: #0a1f12;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85rem;
      text-align: left;
    }
    .btn-new:hover { border-color: #00ff99; background: #0d2a1a; }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .note-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-item:hover { border-color: #00ff9940; color: #ccc; }
    .note-item.active { border-color: #00ff9960; color: #00ff99; background: #0a1f12; }

    .notes-editor { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
    .editor-header { display: flex; align-items: center; gap: 0.5rem; }
    .note-title {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 1rem;
    }
    .note-title:focus { outline: none; border-color: #00ff9940; }

    .btn-delete {
      background: #1a0a0a;
      color: #ff4444;
      border: 1px solid #ff444430;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .btn-delete:hover { border-color: #ff4444; }

    .btn-save {
      background: #0a1f12;
      color: #00ff99;
      border: 1px solid #00ff9940;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .btn-save:hover { border-color: #00ff99; background: #0d2a1a; }

    textarea {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 1rem;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: none;
    }
    textarea:focus { outline: none; border-color: #00ff9940; }
    textarea::placeholder { color: #333; }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 0.9rem;
    }

    .save-indicator { font-size: 0.75rem; color: #333; text-align: right; flex-shrink: 0; }
    .save-indicator.saved { color: #00ff9960; }

    .btn-view {
      background: #0a0f1f;
      color: #4488ff;
      border: 1px solid #4488ff40;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .btn-view:hover { border-color: #4488ff; background: #0d1530; }

    .note-view {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0.5rem 0;
    }
    .nv-step {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.25rem;
      position: relative;
    }
    .nv-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 2.5rem;
    }
    .nv-num {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      background: #1a1a1a;
      border: 2px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #555;
      flex-shrink: 0;
    }
    .nv-step.ai   .nv-num { border-color: #00ff9960; color: #00ff99; background: #0a1f12; }
    .nv-step.human .nv-num { border-color: #ffcc0060; color: #ffcc00; background: #1a1a00; }
    .nv-step.note  .nv-num { border-color: #4488ff60; color: #4488ff; background: #0a0f1f; }
    .nv-connector { width: 2px; flex: 1; min-height: 0.75rem; background: #1a1a1a; margin: 0 auto; }
    .nv-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      flex: 1;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: #ccc;
      line-height: 1.55;
    }
    .nv-step.ai    .nv-card { border-color: #00ff9920; }
    .nv-step.human .nv-card { border-color: #ffcc0020; }
    .nv-step.note  .nv-card { border-color: #4488ff20; }
    .nv-badge {
      display: inline-block;
      font-size: 0.6rem;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .badge-ai    { background: #0d2a1a; color: #00ff99; border: 1px solid #00ff9940; }
    .badge-human { background: #1a1a00; color: #ffcc00; border: 1px solid #ffcc0040; }
    .badge-note  { background: #0a0f1f; color: #4488ff; border: 1px solid #4488ff40; }
    .nv-step.approve .nv-num { border-color: #00ff9960; color: #00ff99; background: #0a1f12; }
    .nv-step.reject  .nv-num { border-color: #ff444460; color: #ff4444; background: #1f0a0a; }
    .nv-step.approve .nv-card { border-color: #00ff9930; }
    .nv-step.reject  .nv-card { border-color: #ff444430; }
    .badge-approve { background: #0d3320; color: #00ff99; border: 1px solid #00ff9940; }
    .badge-reject  { background: #2a0a0a; color: #ff4444; border: 1px solid #ff444440; }

    .nv-sub {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
    }
    .nv-sub-item {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      padding: 0.35rem 0;
      font-size: 0.82rem;
      color: #888;
      border-bottom: 1px solid #1f1f1f;
    }
    .nv-sub-item:last-child { border-bottom: none; }
    .nv-sub-item.deep {
      padding-left: 1.25rem;
      border-left: 2px solid #2a2a2a;
      margin-left: 0.25rem;
      color: #666;
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="messenger.html">Messenger</a>
    <a href="index.html">App</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="notes.html">Notes</a>
  </nav>

  <header>
    <h1>Notes</h1>
    <div class="subtitle">Auto-saved locally · Save to server to persist</div>
  </header>

  <div class="notes-layout">
    <div class="notes-sidebar">
      <button class="btn-new" onclick="newNote()">+ New Note</button>
      <div class="notes-list" id="notesList"></div>
    </div>

    <div class="notes-editor" id="editor" style="display:none;">
      <div class="editor-header">
        <input class="note-title" type="text" id="noteTitle" placeholder="Untitled" oninput="saveNote()">
        <button class="btn-view" id="viewToggle" onclick="toggleView()">View</button>
        <button class="btn-save" onclick="saveToServer()">Save</button>
        <button class="btn-delete" onclick="deleteNote()">Delete</button>
      </div>
      <textarea id="noteBody" placeholder="Start writing..." oninput="saveNote()"></textarea>
      <div class="note-view" id="noteView" style="display:none;"></div>
      <div class="save-indicator" id="saveIndicator">auto-saved</div>
    </div>

    <div class="empty-state" id="emptyState">
      Select a note or create a new one
    </div>
  </div>

  <script>
    let notes = [];
    let activeId = null;

    function persist() {
      localStorage.setItem('hello-scrum-notes', JSON.stringify(notes));
    }

    async function saveToServer() {
      const ind = document.getElementById('saveIndicator');
      ind.textContent = 'saving...';
      ind.className = 'save-indicator';
      try {
        const res = await fetch('/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(notes),
        });
        if (res.ok) {
          ind.textContent = 'saved to server';
          ind.className = 'save-indicator saved';
          clearTimeout(ind._t);
          ind._t = setTimeout(() => { ind.textContent = 'auto-saved'; ind.className = 'save-indicator'; }, 2000);
        }
      } catch (e) {
        ind.textContent = 'server save failed';
        ind.className = 'save-indicator';
      }
    }

    function render() {
      const list = document.getElementById('notesList');
      list.innerHTML = '';
      notes.forEach(n => {
        const el = document.createElement('div');
        el.className = 'note-item' + (n.id === activeId ? ' active' : '');
        el.textContent = n.title || 'Untitled';
        el.onclick = () => openNote(n.id);
        list.appendChild(el);
      });
    }

    function openNote(id) {
      activeId = id;
      const note = notes.find(n => n.id === id);
      document.getElementById('noteTitle').value = note.title || '';
      document.getElementById('noteBody').value = note.body || '';
      document.getElementById('editor').style.display = 'flex';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('saveIndicator').textContent = 'auto-saved';
      document.getElementById('saveIndicator').className = 'save-indicator';
      render();
    }

    function newNote() {
      const id = Date.now();
      notes.unshift({ id, title: '', body: '', created: new Date().toISOString() });
      persist();
      openNote(id);
    }

    function saveNote() {
      const note = notes.find(n => n.id === activeId);
      if (!note) return;
      note.title = document.getElementById('noteTitle').value;
      note.body = document.getElementById('noteBody').value;
      note.updated = new Date().toISOString();
      persist();
      render();
      const ind = document.getElementById('saveIndicator');
      ind.textContent = 'saved';
      ind.className = 'save-indicator saved';
      clearTimeout(ind._t);
      ind._t = setTimeout(() => { ind.textContent = 'auto-saved'; ind.className = 'save-indicator'; }, 1500);
    }

    function deleteNote() {
      if (!activeId) return;
      notes = notes.filter(n => n.id !== activeId);
      activeId = null;
      persist();
      document.getElementById('editor').style.display = 'none';
      document.getElementById('emptyState').style.display = 'flex';
      render();
    }

    let viewMode = false;

    function toggleView() {
      viewMode = !viewMode;
      document.getElementById('noteBody').style.display = viewMode ? 'none' : '';
      document.getElementById('noteView').style.display = viewMode ? 'flex' : 'none';
      document.getElementById('viewToggle').textContent = viewMode ? 'Edit' : 'View';
      if (viewMode) renderView();
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function stepType(text) {
      const t = text.toLowerCase();
      if (/^if\s+human\s+approve/.test(t)) return 'approve';
      if (/^if\s+human\s+reject/.test(t)) return 'reject';
      if (/^agent|^coding agent/.test(t)) return 'ai';
      if (/^human/.test(t)) return 'human';
      return 'note';
    }

    function badgeLabel(type) {
      return { ai: 'Agent', human: 'Human', note: 'Note', approve: 'Approve', reject: 'Reject' }[type] || type;
    }

    // Parse body into top-level steps, each with indented sub-items.
    // Blank lines within an indented block are skipped; a non-indented line
    // signals a new top-level step.
    function parseWorkflow(body) {
      const lines = body.split('\n');
      const steps = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();
        const indent = line.search(/\S/);  // -1 if all whitespace
        if (!trimmed || indent < 0) { i++; continue; }
        if (indent === 0) {
          const step = { text: trimmed, subs: [] };
          i++;
          while (i < lines.length) {
            const next = lines[i];
            const nt = next.trim();
            const ni = next.search(/\S/);
            if (!nt || ni < 0) { i++; continue; }  // blank inside block
            if (ni > 0) { step.subs.push({ text: nt, deep: ni > 4 }); i++; }
            else break;
          }
          steps.push(step);
        } else { i++; }
      }
      return steps;
    }

    function renderView() {
      const body = document.getElementById('noteBody').value;
      const container = document.getElementById('noteView');
      const steps = parseWorkflow(body);

      const html = steps.map((step, i) => {
        const type = stepType(step.text);
        const isLast = i === steps.length - 1;
        const numDisplay = type === 'approve' ? '✓' : type === 'reject' ? '✗' : i + 1;

        const subHtml = step.subs.length
          ? `<div class="nv-sub">${step.subs.map(s => {
              const st = stepType(s.text);
              return `<div class="nv-sub-item${s.deep ? ' deep' : ''}">
                <span class="nv-badge badge-${st}">${badgeLabel(st)}</span>${escHtml(s.text)}
              </div>`;
            }).join('')}</div>`
          : '';

        return `<div class="nv-step ${type}">
          <div class="nv-left">
            <div class="nv-num">${numDisplay}</div>
            ${isLast ? '' : '<div class="nv-connector"></div>'}
          </div>
          <div class="nv-card">
            <span class="nv-badge badge-${type}">${badgeLabel(type)}</span>${escHtml(step.text)}${subHtml}
          </div>
        </div>`;
      }).join('');

      container.innerHTML = html || '<div style="color:#333;padding:1rem">Nothing to render.</div>';
    }

    async function init() {
      try {
        const res = await fetch('/notes.json?t=' + Date.now());
        const serverNotes = await res.json();
        if (Array.isArray(serverNotes) && serverNotes.length > 0) {
          notes = serverNotes;
          persist();
        } else {
          notes = JSON.parse(localStorage.getItem('hello-scrum-notes') || '[]');
        }
      } catch (e) {
        notes = JSON.parse(localStorage.getItem('hello-scrum-notes') || '[]');
      }
      render();
      if (notes.length > 0) openNote(notes[0].id);
    }

    init();
  </script>
</body>
</html>
