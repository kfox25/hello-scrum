<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompts — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 4.5rem 2rem 3rem 15rem; }

    .wf-nav-group {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #888;
      padding: 0.6rem 0.5rem 0.1rem;
      margin-top: 0.5rem;
    }
    .wf-nav-group:first-child { margin-top: 0; }

    .wf-nav-live {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #4488ff;
      padding: 0 0.5rem 0.1rem;
    }
    .wf-nav a.live-link { color: #4488ffaa; border-color: #4488ff20; }
    .wf-nav a.live-link:hover { color: #4488ff; border-color: #4488ff60; background: #0a0f1f; }
    .wf-nav a.live-link.active { color: #4488ff; border-color: #4488ff60; background: #0a0f1f; }

    .live-meta {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      padding: 0.6rem 1rem; background: #0a0f1f;
      border-bottom: 1px solid #1a2a44; font-size: 0.75rem;
    }
    .live-meta-item { display: flex; flex-direction: column; gap: 0.15rem; }
    .live-meta-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: #4488ff80; }
    .live-meta-value { color: #aac4ff; font-family: monospace; }

    .live-section { margin-bottom: 0.75rem; }
    .live-section-label {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: #4488ff80; margin-bottom: 0.3rem;
    }
    .size-pill {
      display: inline-block; font-size: 0.68rem; font-family: monospace;
      color: #555; background: #111; border: 1px solid #222;
      border-radius: 3px; padding: 0.15rem 0.5rem;
    }

    .page-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #00ff99;
      margin-bottom: 0.3rem;
    }
    .page-sub {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 2rem;
    }

    .prompt-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid #1e1e1e;
      background: #141414;
    }
    .prompt-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #00ff99;
    }
    .prompt-id {
      font-size: 0.6rem;
      color: #444;
    }
    .prompt-body {
      padding: 1rem;
      font-size: 0.75rem;
      line-height: 1.75;
      color: #888;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">App</a>
    <a href="intake.html">Intake</a>
    <a href="/">Backlog</a>

    <div class="nav-ref">
      <span class="nav-ref-btn">Artifacts ▾</span>
      <div class="nav-ref-menu">
        <a href="retro.html">Retro</a>
        <a href="audit.html">Audit</a>
      </div>
    </div>
    <div class="nav-ref">
      <span class="nav-ref-btn">Reference ▾</span>
      <div class="nav-ref-menu">
        <a href="hello-scrum.html">Workflow</a>
        <a href="docs.html">Docs</a>
        <a href="prompts.html">Prompts</a>
        <a href="notes.html">Notes</a>
      </div>
    </div>
    <a href="health.html">Health</a>
  </nav>

  <div class="page-title">Agent Prompts</div>
  <div class="page-sub">System prompts used by the pipeline</div>

  <div id="prompts-root"></div>

  <script>
    async function load() {
      const res  = await fetch('/prompts');
      const data = await res.json();
      document.getElementById('prompts-root').innerHTML = data.prompts.map(p => `
        <div class="prompt-card" id="prompt-${p.id}">
          <div class="prompt-header">
            <span class="prompt-label">${p.label}</span>
            <span class="prompt-id">${p.id}</span>
          </div>
          <div class="prompt-body">${escHtml(p.text)}</div>
        </div>`).join('') + `
        <div class="prompt-card" id="prompt-__live__" style="display:none;">
          <div class="prompt-header" style="background:#060c1a;border-color:#1a2a44;">
            <span class="prompt-label" style="color:#4488ff;">Last Agent Call</span>
            <button onclick="refreshLive()" style="background:none;border:none;color:#4488ff80;font-size:0.7rem;cursor:pointer;font-family:monospace;">refresh</button>
          </div>
          <div id="liveBody" class="prompt-body"></div>
        </div>`;

      const nav = document.createElement('div');
      nav.className = 'wf-nav';
      const cards = {};
      const navLinks = {};

      function showPrompt(id) {
        Object.keys(cards).forEach(k => {
          cards[k].style.display = k === id ? '' : 'none';
          navLinks[k].classList.toggle('active', k === id);
        });
      }

      // Live section at top — one entry per call type, grouped by phase
      const LIVE_ENTRIES = [
        { key: 'clarify',            label: 'Requirements Analysis', group: 'Inception'     },
        { key: 'elaborate',          label: 'Inception Elaborate',   group: 'Inception'     },
        { key: 're',                 label: 'Reverse Engineering',   group: 'Inception'     },
        { key: 'fd',                 label: 'Functional Design',     group: 'Construction'  },
        { key: 'nfr',                label: 'NFR Requirements',      group: 'Construction'  },
        { key: 'agent',              label: 'Worker Agent',          group: 'Sprint'        },
        { key: 'story_elaboration',  label: 'Story Elaboration',     group: 'Sprint'        },
        { key: 'code_review',        label: 'Hermes — Code Review',  group: 'Review'        },
        { key: 'ac_check',           label: 'Hermes — AC Check',     group: 'Review'        },
        { key: 'retro',              label: 'Retrospective',         group: 'Learning'      },
        { key: 'wisdom_coding',      label: 'Coding Wisdom',         group: 'Learning'      },
        { key: 'wisdom_ac',          label: 'AC Wisdom',             group: 'Learning'      },
        { key: 'intake_classifier',  label: 'Intake Classifier',     group: 'Intake'        },
        { key: 'intake_transcript',  label: 'Transcript Analyzer',   group: 'Intake'        },
      ];

      cards['__live__'] = document.getElementById('prompt-__live__');

      let liveGroup = null;
      LIVE_ENTRIES.forEach(e => {
        if (e.group !== liveGroup) {
          liveGroup = e.group;
          const hdr = document.createElement('div');
          hdr.className = 'wf-nav-live';
          hdr.textContent = e.group;
          nav.appendChild(hdr);
        }
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'live-link';
        a.textContent = e.label;
        a.dataset.liveKey = e.key;
        a.addEventListener('click', ev => {
          ev.preventDefault();
          showPrompt('__live__');
          fetchLive(e.key, e.label);
          Object.values(navLinks).forEach(l => l.classList && l.classList.remove('active'));
          a.classList.add('active');
        });
        navLinks['live_' + e.key] = a;
        nav.appendChild(a);
      });

      // Phase groups
      let currentGroup = null;
      data.prompts.forEach((p, i) => {
        cards[p.id] = document.getElementById('prompt-' + p.id);
        if (p.group !== currentGroup) {
          currentGroup = p.group;
          const hdr = document.createElement('div');
          hdr.className = 'wf-nav-group';
          hdr.textContent = p.group;
          nav.appendChild(hdr);
        }
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = p.label;
        a.addEventListener('click', e => { e.preventDefault(); showPrompt(p.id); });
        navLinks[p.id] = a;
        nav.appendChild(a);
      });
      document.body.appendChild(nav);
      showPrompt(data.prompts[0].id);
    }

    let _currentLiveKey = null;
    let _currentLiveLabel = null;

    async function fetchLive(key, label) {
      if (key) { _currentLiveKey = key; _currentLiveLabel = label; }
      const body = document.getElementById('liveBody');
      body.innerHTML = '<div style="padding:1rem;color:#444;">Loading…</div>';
      try {
        const res = await fetch('/last-prompt/' + _currentLiveKey);
        if (!res.ok) {
          const d = await res.json();
          body.innerHTML = `<div style="padding:1rem;color:#555;font-style:italic;">${escHtml(d.error || 'Not found.')}</div>`;
          return;
        }
        const d = await res.json();
        renderLive(d);
      } catch(e) {
        body.innerHTML = `<div style="padding:1rem;color:#ff4444;">Error: ${escHtml(e.message)}</div>`;
      }
    }

    function refreshLive() { if (_currentLiveKey) fetchLive(); }

    function renderLive(d) {
      const body = document.getElementById('liveBody');
      const ts  = d.captured_at ? d.captured_at.replace('T', ' ').slice(0, 19) : '—';
      const kb  = n => Math.round(n / 1024) + ' KB';
      const box = content => `<div class="prompt-body" style="padding:0.75rem;background:#0a0a0a;border-radius:4px;border:1px solid #1a1a1a;">${escHtml(content)}</div>`;

      const metaItems = [
        { label: 'Label',    value: d.label || _currentLiveLabel || '—' },
        { label: 'Model',    value: d.model || '—' },
        { label: 'Captured', value: ts },
      ];
      if (d.story) metaItems.splice(1, 0, { label: 'Story', value: (d.story || '').slice(0, 80) });

      let sections = '';

      if (d.system) {
        sections += `<div class="live-section"><div class="live-section-label">System Prompt</div>${box(d.system)}</div>`;
      } else {
        sections += `<div class="live-section"><div class="live-section-label" style="color:#666;">No system prompt — user-turn only</div></div>`;
      }

      if (d.story_header) {
        sections += `<div class="live-section"><div class="live-section-label">Story Payload</div>${box(d.story_header)}</div>`;
        if (d.index_html_chars || d.version_json_chars) {
          sections += `<div class="live-section">
            <div class="live-section-label">File Contents Injected</div>
            ${d.index_html_chars ? `<span class="size-pill">index.html — ${kb(d.index_html_chars)}</span>` : ''}
            ${d.version_json_chars ? `<span class="size-pill" style="margin-left:0.4rem;">version.json — ${kb(d.version_json_chars)}</span>` : ''}
          </div>`;
        }
        (d.context_blocks || []).forEach(b => {
          sections += `<div class="live-section"><div class="live-section-label">${escHtml(b.label)}</div>${box(b.content)}</div>`;
        });
      } else if (d.user) {
        sections += `<div class="live-section"><div class="live-section-label">User Message</div>${box(d.user)}</div>`;
      }

      body.innerHTML = `
        <div class="live-meta">${metaItems.map(m => `
          <div class="live-meta-item">
            <div class="live-meta-label">${m.label}</div>
            <div class="live-meta-value">${escHtml(String(m.value))}</div>
          </div>`).join('')}
        </div>
        <div style="padding:1rem;">${sections}</div>`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    load();
  </script>
<script src="shared.js"></script></body>
</html>
