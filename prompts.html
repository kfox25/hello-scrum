<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompts — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 4.5rem 2rem 3rem 15rem; }

    .wf-nav-group {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #888;
      padding: 0.6rem 0.5rem 0.1rem;
      margin-top: 0.5rem;
    }
    .wf-nav-group:first-child { margin-top: 0; }

    .wf-nav-live {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #4488ff;
      padding: 0 0.5rem 0.1rem;
    }
    .wf-nav a.live-link { color: #4488ffaa; border-color: #4488ff20; }
    .wf-nav a.live-link:hover { color: #4488ff; border-color: #4488ff60; background: #0a0f1f; }
    .wf-nav a.live-link.active { color: #4488ff; border-color: #4488ff60; background: #0a0f1f; }

    .live-meta {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      padding: 0.6rem 1rem; background: #0a0f1f;
      border-bottom: 1px solid #1a2a44; font-size: 0.75rem;
    }
    .live-meta-item { display: flex; flex-direction: column; gap: 0.15rem; }
    .live-meta-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: #4488ff80; }
    .live-meta-value { color: #aac4ff; font-family: monospace; }

    .live-section { margin-bottom: 0.75rem; }
    .live-section-label {
      font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: #4488ff80; margin-bottom: 0.3rem;
    }
    .size-pill {
      display: inline-block; font-size: 0.68rem; font-family: monospace;
      color: #555; background: #111; border: 1px solid #222;
      border-radius: 3px; padding: 0.15rem 0.5rem;
    }

    .page-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #00ff99;
      margin-bottom: 0.3rem;
    }
    .page-sub {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 2rem;
    }

    .prompt-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid #1e1e1e;
      background: #141414;
    }
    .prompt-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #00ff99;
    }
    .prompt-id {
      font-size: 0.6rem;
      color: #444;
    }
    .prompt-body {
      padding: 1rem;
      font-size: 0.75rem;
      line-height: 1.75;
      color: #888;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="page-title">Agent Prompts</div>
  <div class="page-sub">System prompts used by the pipeline</div>

  <div id="prompts-root"></div>

  <script>
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    const LIVE_ENTRIES = [
      { key: 'clarify',           label: 'Requirements Analysis', group: 'Inception',    promptId: 'INCEPTION_CLARIFY_PROMPT'          },
      { key: 'elaborate',         label: 'Inception Elaborate',   group: 'Inception',    promptId: 'INCEPTION_ELABORATE_PROMPT'         },
      { key: 're',                label: 'Reverse Engineering',   group: 'Inception',    promptId: 'INCEPTION_REVERSE_ENGINEER_PROMPT'  },
      { key: 'fd',                label: 'Functional Design',     group: 'Construction', promptId: 'FUNCTIONAL_DESIGN_PROMPT'           },
      { key: 'nfr',               label: 'NFR Requirements',      group: 'Construction', promptId: 'NFR_REQUIREMENTS_PROMPT'            },
      { key: 'agent',             label: 'Worker Agent',          group: 'Sprint',       promptId: 'SYSTEM_PROMPT'                      },
      { key: 'story_elaboration', label: 'Story Elaboration',     group: 'Sprint',       promptId: 'STORY_ELABORATION_PROMPT'           },
      { key: 'code_review',       label: 'Hermes — Code Review',  group: 'Review',       promptId: 'CODE_REVIEW_SYSTEM_PROMPT'          },
      { key: 'ac_check',          label: 'Hermes — AC Check',     group: 'Review',       promptId: 'AC_CHECK_SYSTEM_PROMPT'             },
      { key: 'retro',             label: 'Retrospective',         group: 'Learning',     promptId: 'RETRO_SYSTEM_PROMPT'                },
      { key: 'wisdom_coding',     label: 'Coding Wisdom',         group: 'Learning',     promptId: 'CODING_WISDOM_PROMPT'               },
      { key: 'wisdom_ac',         label: 'AC Wisdom',             group: 'Learning',     promptId: 'AC_WISDOM_PROMPT'                   },
      { key: 'intake_classifier', label: 'Intake Classifier',     group: 'Intake',       promptId: 'INTAKE_CLASSIFIER_PROMPT'           },
      { key: 'intake_transcript', label: 'Transcript Analyzer',   group: 'Intake',       promptId: 'INTAKE_TRANSCRIPT_PROMPT'           },
    ];

    let _currentKey = null;
    const _navLinks = {};

    async function load() {
      const res  = await fetch('/prompts');
      const data = await res.json();
      const staticMap = {};
      data.prompts.forEach(p => { staticMap[p.id] = p; });

      document.getElementById('prompts-root').innerHTML = `
        <div class="prompt-card">
          <div class="prompt-header" style="background:#060c1a;border-color:#1a2a44;">
            <span class="prompt-label" id="liveTitle" style="color:#4488ff;">Select a prompt</span>
            <button onclick="refreshLive()" style="background:none;border:none;color:#4488ff40;font-size:0.7rem;cursor:pointer;font-family:monospace;">refresh</button>
          </div>
          <div id="staticToggleRow" style="display:none;padding:0.35rem 1rem;background:#050a14;border-bottom:1px solid #111;">
            <button id="staticToggleBtn" onclick="toggleStatic()" style="background:none;border:none;color:#888;font-size:0.7rem;cursor:pointer;font-family:monospace;padding:0;">Static ▾</button>
          </div>
          <div id="staticSection" style="display:none;">
            <div id="staticBody" class="prompt-body" style="background:#111;border-bottom:1px solid #222;color:#888;"></div>
          </div>
          <div id="liveBody" class="prompt-body" style="color:#333;font-style:italic;">Select a prompt from the left.</div>
        </div>`;

      const nav = document.createElement('div');
      nav.className = 'wf-nav';

      let currentGroup = null;
      LIVE_ENTRIES.forEach(e => {
        if (e.group !== currentGroup) {
          currentGroup = e.group;
          const hdr = document.createElement('div');
          hdr.className = 'wf-nav-group';
          hdr.textContent = e.group;
          nav.appendChild(hdr);
        }
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = e.label;
        a.addEventListener('click', ev => {
          ev.preventDefault();
          Object.values(_navLinks).forEach(l => l.classList.remove('active'));
          a.classList.add('active');
          fetchLive(e.key, e.label, staticMap[e.promptId]);
        });
        _navLinks[e.key] = a;
        nav.appendChild(a);
      });

      document.body.appendChild(nav);
    }

    async function fetchLive(key, label, staticPrompt) {
      _currentKey = key;
      document.getElementById('liveTitle').textContent = label || key;

      const staticRow = document.getElementById('staticToggleRow');
      const staticSec = document.getElementById('staticSection');
      const staticBody = document.getElementById('staticBody');
      const staticBtn = document.getElementById('staticToggleBtn');
      if (staticPrompt) {
        staticBody.textContent = staticPrompt.text || '';
        staticRow.style.display = '';
        staticSec.style.display = 'none';
        staticBtn.textContent = 'Static ▾';
      } else {
        staticRow.style.display = 'none';
        staticSec.style.display = 'none';
      }

      const liveBody = document.getElementById('liveBody');
      liveBody.innerHTML = '<div style="color:#444;">Loading…</div>';
      try {
        const res = await fetch('/last-prompt/' + key);
        if (!res.ok) {
          const d = await res.json();
          liveBody.innerHTML = `<div style="color:#555;font-style:italic;">${escHtml(d.error || 'Not found.')}</div>`;
          return;
        }
        renderLive(await res.json());
      } catch(e) {
        liveBody.innerHTML = `<div style="color:#ff4444;">Error: ${escHtml(e.message)}</div>`;
      }
    }

    function refreshLive() {
      if (!_currentKey) return;
      const active = Object.entries(_navLinks).find(([k]) => k === _currentKey);
      if (active) {
        const e = LIVE_ENTRIES.find(x => x.key === _currentKey);
        fetchLive(_currentKey, e && e.label, null);
      }
    }

    function toggleStatic() {
      const sec = document.getElementById('staticSection');
      const btn = document.getElementById('staticToggleBtn');
      const opening = sec.style.display === 'none';
      sec.style.display = opening ? '' : 'none';
      btn.textContent = opening ? 'Static ▴' : 'Static ▾';
    }

    function renderLive(d) {
      const body = document.getElementById('liveBody');
      const ts  = d.captured_at ? d.captured_at.replace('T', ' ').slice(0, 19) : '—';
      const kb  = n => Math.round(n / 1024) + ' KB';
      const box = c => `<div class="prompt-body" style="padding:0.75rem;background:#0a0a0a;border-radius:4px;border:1px solid #1a1a1a;margin-top:0.3rem;">${escHtml(c)}</div>`;

      const metaItems = [{ label: 'Model', value: d.model || '—' }, { label: 'Captured', value: ts }];
      if (d.story) metaItems.push({ label: 'Story', value: d.story.slice(0, 80) });

      let sections = '';
      if (d.story_header) {
        sections += `<div class="live-section"><div class="live-section-label">Story Payload</div>${box(d.story_header)}</div>`;
        if (d.index_html_chars || d.version_json_chars) {
          sections += `<div class="live-section"><div class="live-section-label">Files Injected</div>
            ${d.index_html_chars  ? `<span class="size-pill">index.html — ${kb(d.index_html_chars)}</span>` : ''}
            ${d.version_json_chars ? `<span class="size-pill" style="margin-left:0.4rem;">version.json — ${kb(d.version_json_chars)}</span>` : ''}
          </div>`;
        }
        (d.context_blocks || []).forEach(b => {
          sections += `<div class="live-section"><div class="live-section-label">${escHtml(b.label)}</div>${box(b.content)}</div>`;
        });
      } else if (d.user) {
        sections += `<div class="live-section"><div class="live-section-label">User Message</div>${box(d.user)}</div>`;
      }

      body.innerHTML = `
        <div class="live-meta">${metaItems.map(m =>
          `<div class="live-meta-item"><div class="live-meta-label">${m.label}</div><div class="live-meta-value">${escHtml(String(m.value))}</div></div>`
        ).join('')}</div>
        <div style="padding:1rem 1rem 0.5rem;">${sections || '<div style="color:#444;font-style:italic;">No content captured yet.</div>'}</div>`;
    }

    load();
  </script>
<script src="shared.js"></script></body>
</html>
