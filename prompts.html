<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompts — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 4.5rem 2rem 3rem 15rem; }

    .page-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #00ff99;
      margin-bottom: 0.3rem;
    }
    .page-sub {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 2rem;
    }

    .prompt-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1rem;
      border-bottom: 1px solid #1e1e1e;
      background: #141414;
    }
    .prompt-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #00ff99;
    }
    .prompt-id {
      font-size: 0.6rem;
      color: #444;
    }
    .prompt-body {
      padding: 1rem;
      font-size: 0.75rem;
      line-height: 1.75;
      color: #888;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="page-title">Agent Prompts</div>
  <div class="page-sub">System prompts used by the pipeline</div>

  <div id="prompts-root"></div>

  <script>
    async function load() {
      const res  = await fetch('/prompts');
      const data = await res.json();
      document.getElementById('prompts-root').innerHTML = data.prompts.map(p => `
        <div class="prompt-card" id="prompt-${p.id}">
          <div class="prompt-header">
            <span class="prompt-label">${p.label}</span>
            <span class="prompt-id">${p.id}</span>
          </div>
          <div class="prompt-body">${escHtml(p.text)}</div>
        </div>`).join('');

      const nav = document.createElement('div');
      nav.className = 'wf-nav';
      const cards = {};
      const navLinks = {};

      function showPrompt(id) {
        Object.keys(cards).forEach(k => {
          cards[k].style.display = k === id ? '' : 'none';
          navLinks[k].classList.toggle('active', k === id);
        });
      }

      data.prompts.forEach((p, i) => {
        cards[p.id] = document.getElementById('prompt-' + p.id);
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = p.label;
        a.addEventListener('click', e => { e.preventDefault(); showPrompt(p.id); });
        navLinks[p.id] = a;
        nav.appendChild(a);
      });
      document.body.appendChild(nav);
      showPrompt(data.prompts[0].id);
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    load();
  </script>
<script src="shared.js"></script></body>
</html>
