<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retrospective — Hello Scrum</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding: 4rem 2rem 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .page-layout {
      display: flex;
      gap: 2rem;
      flex: 1;
      min-height: 0;
    }
    .col { flex: 1; min-width: 0; overflow-y: auto; padding-bottom: 2rem; }

    .col-header {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #222;
    }
    h2 { color: #00ff99; font-size: 1.4rem; }
    .subtitle { color: #555; font-size: 0.85rem; margin-top: 0.25rem; }

    .sys-group { margin-bottom: 1.75rem; }
    .sys-group-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #1a1a1a;
    }
    .sys-group-label.lbl-failure    { color: #ff444480; }
    .sys-group-label.lbl-improve    { color: #4488ff80; }
    .sys-group-label.lbl-success    { color: #00ff9980; }
    .sys-group-label.lbl-observe    { color: #ffcc0080; }
    .sys-finding {
      display: flex;
      gap: 0.6rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #141414;
    }
    .sys-finding:last-child { border-bottom: none; }
    .sys-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      margin-top: 0.6rem;
      flex-shrink: 0;
    }
    .dot-failure { background: #ff4444; }
    .dot-improve { background: #4488ff; }
    .dot-success { background: #00ff99; }
    .dot-observe { background: #ffcc00; }
    .sys-body { flex: 1; }
    .sys-text { font-size: 0.85rem; color: #ccc; line-height: 1.5; }
    .sys-origin { font-size: 0.7rem; color: #2a2a2a; margin-top: 0.1rem; }

    .retro-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .retro-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .retro-date { color: #00ff99; font-size: 0.9rem; flex-shrink: 0; }
    .retro-summary { color: #aaa; font-size: 0.85rem; flex: 1; line-height: 1.4; }
    .retro-stats {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      color: #555;
      flex-shrink: 0;
    }
    .stat-done   { color: #00ff9980; }
    .stat-failed { color: #ff444480; }

    .findings {
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .finding {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.55rem 0;
      border-bottom: 1px solid #1f1f1f;
    }
    .finding:last-child { border-bottom: none; }
    .finding-badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }
    .badge-failure_pattern { background: #2a0a0a; color: #ff6666; border: 1px solid #ff444440; }
    .badge-success_pattern { background: #0d3320; color: #00ff99; border: 1px solid #00ff9940; }
    .badge-improvement     { background: #0a0f1f; color: #4488ff; border: 1px solid #4488ff40; }
    .badge-observation     { background: #1a1400; color: #ffcc00; border: 1px solid #ffcc0040; }
    .finding-text { font-size: 0.85rem; color: #ccc; line-height: 1.5; }

    .empty   { color: #333; text-align: center; padding: 3rem; }
    .loading { color: #444; text-align: center; padding: 3rem; }
    .error   { color: #ff4444; text-align: center; padding: 3rem; }

    .impact {
      border-top: 1px solid #1f1f1f;
      padding: 0.75rem 1.25rem;
    }
    .impact-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #333;
      margin-bottom: 0.5rem;
    }
    .impact-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1a1a1a;
    }
    .impact-item:last-child { border-bottom: none; }
    .impact-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 0.45rem;
      flex-shrink: 0;
    }
    .dot-done   { background: #00ff99; }
    .dot-failed { background: #ff4444; }
    .impact-body { flex: 1; }
    .impact-idea { font-size: 0.85rem; color: #ccc; margin-bottom: 0.2rem; }
    .impact-outcome { font-size: 0.78rem; color: #555; line-height: 1.4; }
    .outcome-done   { color: #00ff9980; }
    .outcome-failed { color: #ff444480; }
    .impact-none { font-size: 0.8rem; color: #2a2a2a; font-style: italic; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="messenger.html">Messenger</a>
    <a href="index.html">App</a>
    <a href="/">Backlog</a>
    <a href="active.html">Live Work</a>
    <a href="audit.html">Audit</a>
    <a href="retro.html">Retro</a>
    <a href="workflow.html">Workflow</a>
    <a href="notes.html">Notes</a>
  </nav>
  <div class="page-layout">

    <div class="col">
      <div class="col-header">
        <h2>Sprint Retros</h2>
        <div class="subtitle">AI agent reflections per sprint</div>
      </div>
      <div id="retros"><div class="loading">Loading...</div></div>
    </div>

    <div class="col">
      <div class="col-header">
        <h2>System Retro</h2>
        <div class="subtitle">Aggregated learnings across all sprints</div>
      </div>
      <div id="system-retro"><div class="loading">Loading...</div></div>
    </div>

  </div>

  <script>
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    const TYPE_LABELS = {
      failure_pattern: 'Failure',
      success_pattern: 'Success',
      improvement: 'Improve',
      observation: 'Observe',
    };

    function contextKey(r) {
      return (r.findings || []).map(f => `[${f.type}] ${f.text}`).join('\n');
    }

    function renderImpact(recipients) {
      if (!recipients.length) {
        return `<div class="impact"><div class="impact-none">Sprint ended — no subsequent story received this context.</div></div>`;
      }
      const rows = recipients.map(item => {
        const done = item.status === 'done';
        const dotClass = done ? 'dot-done' : 'dot-failed';
        const outcomeClass = done ? 'outcome-done' : 'outcome-failed';
        const outcomeLabel = done ? '✓ passed' : '✗ failed';
        const reason = escHtml((item.ac_check_reason || item.hermes_reason || item.error || '').slice(0, 160));
        return `<div class="impact-item">
          <div class="impact-dot ${dotClass}"></div>
          <div class="impact-body">
            <div class="impact-idea">${escHtml(item.idea || '')}</div>
            <div class="impact-outcome"><span class="${outcomeClass}">${outcomeLabel}</span>${reason ? ' — ' + reason : ''}</div>
          </div>
        </div>`;
      }).join('');
      return `<div class="impact"><div class="impact-label">Passed forward to</div>${rows}</div>`;
    }

    function renderRetro(r, recipients) {
      const findings = (r.findings || []).map(f => {
        const label = TYPE_LABELS[f.type] || f.type;
        return `<div class="finding">
          <span class="finding-badge badge-${escHtml(f.type)}">${escHtml(label)}</span>
          <span class="finding-text">${escHtml(f.text)}</span>
        </div>`;
      }).join('');

      return `<div class="retro-card">
        <div class="retro-header">
          <div class="retro-date">${escHtml(r.sprint_date || '')}</div>
          <div class="retro-summary">${escHtml(r.summary || '')}</div>
          <div class="retro-stats">
            <span>${r.items_analyzed || 0} items</span>
            <span class="stat-done">${r.items_done || 0} done</span>
            <span class="stat-failed">${r.items_failed || 0} failed</span>
          </div>
        </div>
        ${findings ? `<div class="findings">${findings}</div>` : ''}
        ${renderImpact(recipients)}
      </div>`;
    }

    const SYS_GROUPS = [
      { type: 'failure_pattern', label: 'Avoid — failure patterns',  lbl: 'lbl-failure', dot: 'dot-failure' },
      { type: 'improvement',     label: 'Apply — improvements',       lbl: 'lbl-improve', dot: 'dot-improve' },
      { type: 'success_pattern', label: 'Keep — success patterns',    lbl: 'lbl-success', dot: 'dot-success' },
      { type: 'observation',     label: 'Note — observations',        lbl: 'lbl-observe', dot: 'dot-observe' },
    ];

    function renderSystemRetro(retros) {
      if (!retros.length) {
        return '<div class="empty">No sprint data yet — run a sprint to populate learnings.</div>';
      }
      return SYS_GROUPS.map(g => {
        const seen = new Set();
        const findings = [];
        retros.forEach(r => {
          (r.findings || []).filter(f => f.type === g.type).forEach(f => {
            if (!seen.has(f.text)) {
              seen.add(f.text);
              findings.push({ text: f.text, date: r.sprint_date || '' });
            }
          });
        });
        if (!findings.length) return '';
        const rows = findings.map(f => `
          <div class="sys-finding">
            <div class="sys-dot ${g.dot}"></div>
            <div class="sys-body">
              <div class="sys-text">${escHtml(f.text)}</div>
              ${f.date ? `<div class="sys-origin">${escHtml(f.date)}</div>` : ''}
            </div>
          </div>`).join('');
        return `<div class="sys-group">
          <div class="sys-group-label ${g.lbl}">${g.label}</div>
          ${rows}
        </div>`;
      }).join('');
    }

    Promise.all([
      fetch('/retrospective.json?t=' + Date.now()).then(r => r.json()),
      fetch('/backlog.json?t=' + Date.now()).then(r => r.json()),
    ]).then(([retroData, backlogData]) => {
        const retros = retroData.retros || [];
        if (!retros.length) {
          document.getElementById('retros').innerHTML = '<div class="empty">No retrospectives yet — run a sprint to generate findings.</div>';
        } else {
          const sprintItems = (backlogData.items || []).filter(i => i.in_sprint);
          const html = retros.map(r => {
            const key = contextKey(r);
            const recipients = sprintItems.filter(i => i.retro_context === key);
            return renderRetro(r, recipients);
          }).join('');
          document.getElementById('retros').innerHTML = html;
        }
        document.getElementById('system-retro').innerHTML = renderSystemRetro(retros);
      })
      .catch(err => {
        document.getElementById('retros').innerHTML = `<div class="error">Failed to load data<br>${err}</div>`;
        document.getElementById('system-retro').innerHTML = `<div class="error">Failed to load data<br>${err}</div>`;
      });
  </script>
</body>
</html>
